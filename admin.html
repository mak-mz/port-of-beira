<style>
/* Layout: operations console — fixed top bar with publish state, section rail on the left, one editing column */
:root{
  --navy:#2E2E6F; --navy-deep:#1C1C4A; --orange:#FF9012; --steel:#A1A1AC;
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#ECECF3; --ink:#1B1A33; --muted:#606075; --line:#DADAE5;
  --accent:#2E2E6F; --accent-ink:#B35F00; --ok:#1E7B4F; --warn:#B35F00; --err:#B42318;
  --shadow:0 1px 2px rgba(30,30,80,.05),0 8px 24px -14px rgba(30,30,80,.25);
  --f-display:"Dax","Fira Sans Condensed","Fira Sans",system-ui,sans-serif;
  --f-body:"Dax","Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"Fira Sans Condensed","Dax","Fira Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0D1E; --surface:#16163A; --surface-2:#1F1F48; --ink:#ECECF5; --muted:#A1A1AC; --line:#2D2D5C;
  --accent:#B0B0F2; --accent-ink:#FFA640; --ok:#4CC38A; --warn:#FFA640; --err:#FF7A6E; --shadow:0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0D1E; --surface:#16163A; --surface-2:#1F1F48; --ink:#ECECF5; --muted:#A1A1AC; --line:#2D2D5C;
  --accent:#B0B0F2; --accent-ink:#FFA640; --ok:#4CC38A; --warn:#FFA640; --err:#FF7A6E; --shadow:0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding-top:var(--topH,63px)!important;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}
img{max-width:100%}
[hidden]{display:none!important}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:40;box-shadow:0 1px 0 rgba(255,255,255,.06),0 6px 18px rgba(0,0,0,.18);background:var(--navy-deep);color:#fff;display:flex;align-items:center;gap:14px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));padding-top:calc(12px + env(safe-area-inset-top,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy-deep);z-index:30}
.mark{display:flex;align-items:center;gap:12px;min-width:0}
.mark .logo{height:34px;display:flex;align-items:center}
.mark .logo img{height:100%;width:auto;max-width:140px;object-fit:contain}
.wm{display:flex;flex-direction:column;line-height:1;font-family:var(--f-display)}
.wm b{font-weight:900;letter-spacing:.06em;font-size:1.05rem}
.wm small{font-size:.55rem;letter-spacing:.28em;text-transform:uppercase;opacity:.75;margin-top:3px}
.mark .sep{width:1px;height:28px;background:rgba(255,255,255,.2)}
.mark .app{font-family:var(--f-data);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;color:var(--orange);white-space:nowrap}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.82rem;color:rgba(255,255,255,.8);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:#4CC38A;box-shadow:0 0 0 3px rgba(76,195,138,.2)}
.status.dirty i{background:var(--orange);box-shadow:0 0 0 3px rgba(255,144,18,.25)}
.top .acts{display:flex;gap:8px}
.tbtn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:.88rem;text-decoration:none;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tbtn.ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.tbtn.ghost:hover{background:rgba(255,255,255,.16)}
.tbtn.pub{background:var(--orange);color:#1F140F}
.tbtn.pub:disabled{opacity:.45;cursor:default}
.tbtn svg{width:16px;height:16px}
@media (max-width:760px){.status span{display:none}.mark .sep,.mark .app{display:none}.tbtn .lbl-l{display:none}}
@media (max-width:520px){.top{gap:8px}.mark .logo{height:22px}.mark .logo img{max-width:96px;height:22px}.top .tbtn{padding:8px 11px}.lang-cms button{padding:3px 8px}}
.mark{flex:0 1 auto;overflow:hidden}.mark .logo img{flex:0 1 auto;min-width:0}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - var(--topH,63px))}
.side{border-right:1px solid var(--line);background:var(--surface);padding:18px 12px;position:sticky;top:var(--topH,63px);height:calc(100vh - var(--topH,63px));overflow:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}
.side h4{font-family:var(--f-data);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:6px 10px 8px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;padding:10px 12px;border-radius:10px;text-align:left;font-weight:500;color:var(--muted)}
.side button:hover{background:var(--surface-2);color:var(--ink)}
.side button[aria-current="true"]{background:var(--navy);color:#fff}
.side button small{font-family:var(--f-data);font-size:.75rem;opacity:.75;font-variant-numeric:tabular-nums}
.side .foot{margin-top:18px;padding:12px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:var(--topH,63px);z-index:10;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
  .side h4,.side .foot{display:none}
  .side nav{flex-direction:row;overflow-x:auto}
  .side button{flex:0 0 auto;padding:8px 12px}
  .side button small{display:none}
}
main{padding:28px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px));min-width:0}
.col{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sec-h{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.sec-h .eyebrow{font-family:var(--f-data);font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink)}
.sec-h h1{font-size:clamp(1.6rem,3vw,2.1rem);font-weight:900}
.sec-h p{color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:1.1rem;font-weight:700}
.card-h .r{display:flex;gap:6px;flex-wrap:wrap}
.banner{border-radius:12px;padding:12px 14px;font-size:.9rem;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--orange) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--orange) 40%,transparent)}
.banner.info{background:var(--surface-2);border-color:var(--line)}

/* fields */
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.f .lbl{font-weight:700;font-size:.82rem}
.hint{font-size:.78rem;color:var(--muted)}
.f input[type=text],.f input[type=password],.f input[type=date],.f input[type=email],.f textarea{width:100%;font:inherit;font-size:.95rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.f textarea{min-height:92px;resize:vertical}
.f input:focus,.f textarea:focus,.dt input:focus{outline:2px solid var(--orange);outline-offset:0;border-color:transparent}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.spec{display:grid;grid-template-columns:110px 110px minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:560px){.g2{grid-template-columns:1fr}.spec{grid-template-columns:1fr 1fr}.spec .f:nth-child(3){grid-column:1/-1}}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.del{color:var(--err)}
.btn.ic{padding:6px 10px}
.btn:disabled{opacity:.5;cursor:default}
.add{align-self:flex-start}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle span{font-weight:500}
.toggle small{display:block;color:var(--muted);font-size:.78rem;font-weight:400}
.sw{position:relative;width:44px;height:26px;flex:0 0 auto}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s;pointer-events:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--navy)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:3px solid var(--orange);outline-offset:2px}
.imgf{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.thumb{width:132px;height:84px;border-radius:10px;border:1px dashed var(--line);background:var(--surface-2) center/contain no-repeat;display:grid;place-items:center;font-size:.72rem;color:var(--muted);flex:0 0 auto}
.thumb.dark{background-color:var(--navy-deep);color:rgba(255,255,255,.6)}
.thumb.cover{background-size:cover}
.imgf .r{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fb{position:relative;overflow:hidden}
.imgpath{font:inherit;font-size:.8rem;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:230px;max-width:100%}
.fb input{position:absolute;inset:0;opacity:0;cursor:pointer}
.busy{opacity:.6;pointer-events:none}
.font-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.font-row:last-child{border-bottom:0}
.font-row .s{font-family:"Dax",var(--f-body);font-size:1.15rem}
