/* Dax: usa a fonte instalada; os ficheiros carregados no CMS substituem isto */
@font-face{font-family:"Dax";src:local("Dax-Light"),local("Dax Light");font-weight:300}
@font-face{font-family:"Dax";src:local("Dax-Regular"),local("Dax Regular"),local("Dax");font-weight:400}

<style>
/* Layout: dark quay-side hero band (3D container yard on home), then light "port document" pages on a navy-tinted ground */
:root{--ls-title:-.01em;--ls-label:.12em;--ls-unit:.04em;--ls-body:0em}
body{letter-spacing:var(--ls-body)}
:root{
  --navy:#2E2E6F; --navy-deep:#1C1C4A; --orange:#FF9012; --coal:#1F140F; --steel:#A1A1AC;
  --bg:#F4F4F8; --surface:#FFFFFF; --surface-2:#ECECF3; --ink:#1B1A33; --muted:#5F5F74; --line:#D9D9E4;
  --accent:#2E2E6F; --accent-ink:#B35F00; --bar:#C9C9D6; --ok:#1E7B4F; --err:#B42318;
  --shadow:0 1px 2px rgba(30,30,80,.06),0 12px 32px -12px rgba(30,30,80,.18);
  --f-display:"Dax","Fira Sans Condensed","Fira Sans",system-ui,sans-serif;
  --f-body:"Dax","Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"Fira Sans Condensed","Dax","Fira Sans",system-ui,sans-serif;
  --r:14px; --side:8cm; --gut:max(16px,env(safe-area-inset-left,0px),min(var(--side),calc((100vw - 1240px) / 2))); --gut-r:max(16px,env(safe-area-inset-right,0px),min(var(--side),calc((100vw - 1240px) / 2)));
  --util-h:38px; --bar-h:72px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E20; --surface:#16163A; --surface-2:#1E1E48; --ink:#ECECF5; --muted:#A1A1AC; --line:#2C2C5C;
  --accent:#A9A9F0; --accent-ink:#FFA640; --bar:#3A3A6E; --ok:#4CC38A; --err:#FF7A6E; --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E20; --surface:#16163A; --surface-2:#1E1E48; --ink:#ECECF5; --muted:#A1A1AC; --line:#2C2C5C;
  --accent:#A9A9F0; --accent-ink:#FFA640; --bar:#3A3A6E; --ok:#4CC38A; --err:#FF7A6E; --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body-f,var(--f-body));font-weight:var(--body-w,400);font-size:calc(17px * var(--body-k,1));line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-weight:500;font-family:var(--f-display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:var(--ls-title)}
h2{font-family:var(--section-f,var(--f-display))}h3,h4{font-family:var(--sub-f,var(--f-display))}
.prose,.sec-head p,.loc .body,.tbody p,.ncard p,.vcard p{font-family:var(--body-f,var(--f-body))}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}
.wrap{max-width:none;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r)}
.eyebrow{font-family:var(--label-f,var(--f-data));font-weight:var(--label-w,500);font-size:calc(.78rem * var(--label-k,1));letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--accent-ink)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Header ---------- */
.hdr{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top,0px);color:#fff;transition:background .3s,box-shadow .3s,color .3s}
.util{height:var(--util-h);border-bottom:1px solid rgba(255,255,255,.1);font-family:var(--nav-f,inherit);font-size:calc(.82rem * var(--nav-k,1));transition:height .3s,opacity .3s;overflow:hidden}
.util-in{height:100%;display:flex;align-items:center;gap:20px}
.util nav{display:flex;gap:18px}
.util a{text-decoration:none;opacity:.8}.util a:hover,.util a[aria-current="page"]{opacity:1;color:var(--orange)}
.util-r{margin-left:auto;display:flex;align-items:center;gap:16px}
.hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden}
.wx{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;opacity:.9;font-variant-numeric:tabular-nums}.wx b{font-weight:500;color:var(--orange)}.wx svg{flex:0 0 auto}.wx[hidden]{display:none}
.soc{display:flex;gap:12px}
.lang{display:inline-flex;border-radius:999px;box-shadow:inset 0 0 0 1px currentColor;padding:2px;gap:2px;opacity:.9}
.lang button{border:0;background:none;padding:2px 9px;border-radius:999px;font-family:var(--label-f,var(--f-data));font-weight:500;font-size:.72rem;letter-spacing:var(--ls-label)}
.lang button[aria-pressed="true"]{background:var(--orange);color:#1F140F}
.bar{display:flex;align-items:center;gap:20px;height:var(--bar-h)}
.hdr:not(.solid):not(.open){background:var(--hbBg,none)}
.hdr.hb-blur:not(.solid):not(.open){backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hdr.solid{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.hdr.open{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.hdr.solid .util{height:0;opacity:0;border:0}
.brand{display:flex;align-items:center;text-decoration:none;min-width:0;height:50px;flex:0 1 auto}
.brand img{height:100%;width:auto;max-width:min(220px,58vw);object-fit:contain;object-position:left center}
.brand .lg-color{display:none}
.hdr.solid .brand .lg-color{display:block}.hdr.solid .brand .lg-white{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hdr.solid .brand .lg-color{display:none}:root:not([data-theme="light"]) .hdr.solid .brand .lg-white{display:block}}
:root[data-theme="dark"] .hdr.solid .brand .lg-color{display:none}:root[data-theme="dark"] .hdr.solid .brand .lg-white{display:block}
.wordmark{display:flex;flex-direction:column;line-height:1;font-family:var(--f-display)}
.wordmark b{font-weight:500;font-size:1.3rem;letter-spacing:var(--ls-unit)}
.wordmark small{font-weight:500;font-size:.6rem;letter-spacing:var(--ls-label);text-transform:uppercase;opacity:.8;margin-top:4px}
.nav{margin-left:auto}
.nav>ul{list-style:none;margin:0;padding:0;display:flex;gap:2px;align-items:center}
.nav li{position:relative}
.nav .top-a{display:flex;align-items:center;gap:6px;text-decoration:none;font-family:var(--nav-f,inherit);font-weight:var(--nav-w,500);font-size:calc(.92rem * var(--nav-k,1));padding:8px 12px;border-radius:999px;border:0;background:none;white-space:nowrap}
.nav .top-a:hover,.nav li:focus-within>.top-a{background:color-mix(in srgb,currentColor 12%,transparent)}
.nav .top-a[aria-current="page"],.nav .top-a.cur{color:var(--orange)}
.hdr.solid .nav .top-a[aria-current="page"],.hdr.solid .nav .top-a.cur{color:var(--accent-ink)}
.nav .chev{width:10px;height:10px;transition:transform .2s}
.sub{list-style:none;margin:0;padding:8px;position:absolute;left:0;top:calc(100% + 8px);min-width:260px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translateY(6px);transition:.18s}
.sub::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px}
.sub a{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:9px;text-decoration:none;font-family:var(--nav-f,inherit);font-weight:var(--nav-w,500);font-size:calc(.93rem * var(--nav-k,1))}
.sub a:hover,.sub a:focus-visible{background:var(--surface-2)}
.sub a[aria-current="page"]{color:var(--accent-ink);font-weight:500}
.sub a .ext{opacity:.5;font-size:.8em}
@media (hover:hover){.nav li.has-sub:hover>.sub{opacity:1;visibility:visible;transform:none}.nav>ul>li.has-sub:hover>.top-a .chev{transform:rotate(180deg)}}
.nav li.open>.sub{opacity:1;visibility:visible;transform:none}
.nav>ul>li.open>.top-a .chev{transform:rotate(180deg)}
.nav .m-only{display:none}
.menu-btn{display:none;margin-left:auto;background:none;border:0;width:44px;height:44px;border-radius:10px}
.menu-btn span{display:block;width:22px;height:2px;background:currentColor;margin:5px auto;transition:transform .25s,opacity .2s}
.sub .sub-b{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:0;background:none;color:inherit;border-radius:9px;cursor:pointer;text-align:left;font-family:var(--nav-f,inherit);font-weight:var(--nav-w,500);font-size:calc(.93rem * var(--nav-k,1))}
.sub .sub-b:hover,.sub .sub-b:focus-visible,.sub li.open>.sub-b{background:var(--surface-2)}
.sub .sub-b.cur{color:var(--accent-ink)}
@media (min-width:1181px){
  .sub .sub{top:-9px;left:calc(100% + 6px)}
  .sub .sub::before{left:-10px;top:0;bottom:0;right:auto;width:10px;height:auto}
  .has-sub.rt .sub .sub{left:auto;right:calc(100% + 6px)}
  .has-sub.rt .sub .sub::before{left:auto;right:-10px}
  .sub .chev{transform:rotate(-90deg)}
  .has-sub.rt .sub .chev{transform:rotate(90deg)}
  @media (hover:hover){.sub li.has-sub:hover>.sub{opacity:1;visibility:visible;transform:none}.sub li.has-sub:hover>.sub-b{background:var(--surface-2)}}
  .sub li.open>.sub{opacity:1;visibility:visible;transform:none}
}
@media (max-width:1180px){
  :root{--util-h:0px}
  .util{display:none}
  .menu-btn{display:block}
  .nav{position:fixed;inset:calc(var(--bar-h) + env(safe-area-inset-top,0px)) 0 0;background:var(--surface);color:var(--ink);padding:8px var(--gut-r) calc(24px + env(safe-area-inset-bottom,0px)) var(--gut);overflow:auto;transform:translateX(100%);transition:transform .3s;visibility:hidden}
  .hdr.open .nav{transform:none;visibility:visible}
  .hdr.open{background:var(--surface);color:var(--ink)}
  .nav>ul{flex-direction:column;align-items:stretch;gap:0}
  .nav .top-a{width:100%;justify-content:space-between;font-size:calc(1.08rem * var(--nav-k,1));padding:14px 8px;border-radius:0;border-bottom:1px solid var(--line)}
  .sub{position:static;opacity:1;visibility:visible;transform:none;box-shadow:none;border:0;border-radius:0;padding:0 0 8px 12px;display:none;min-width:0;background:none}
  .nav li.open>.sub{display:block}
  .sub .sub{padding:0 0 4px 14px;border-left:2px solid var(--line);margin-left:6px}
  .sub .sub-b{padding:12px 8px;font-size:calc(1rem * var(--nav-k,1))}
  .sub li.open>.sub-b .chev,.nav li.open>.top-a .chev{transform:rotate(180deg)}
  .sub .sub-b .chev{transform:none}
  .nav .m-only{display:block}
  .nav .m-row{display:flex;flex-wrap:wrap;gap:8px 18px;padding:18px 8px 6px;font-size:.92rem}
  .nav .m-row a{text-decoration:none;color:var(--muted)}
  .nav .m-row .lang{color:var(--ink)}
  .hdr.open .menu-btn span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .hdr.open .menu-btn span:nth-child(2){opacity:0}
  .hdr.open .menu-btn span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  .hdr.open .brand .lg-color{display:block}.hdr.open .brand .lg-white{display:none}
}

/* ---------- Hero band (always dark) ---------- */
.hero{position:relative;background:var(--navy-deep);color:#fff;overflow:hidden;isolation:isolate;padding-top:calc(var(--util-h) + var(--bar-h) + env(safe-area-inset-top,0px))}
.hero-bg{position:absolute;inset:0;z-index:-3;background-size:cover;background-position:center}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(28,28,74,.94) 0%,rgba(28,28,74,.72) 50%,rgba(28,28,74,.4) 100%)}
.hv-play{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 108px);z-index:5;width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,144,18,.95);color:#1F140F;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer}.hv-play[hidden]{display:none}
.hv-pause{position:absolute;right:var(--gut-r,24px);bottom:22px;z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(28,28,74,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s}
.hv-pause:hover,.hv-pause:focus-visible{background:var(--orange);border-color:var(--orange);color:#1F140F}.hv-pause[hidden]{display:none}
.hv-pause.hv-next{right:calc(var(--gut-r,24px) + 54px)}
.hv-pause svg{width:18px;height:18px}.hv-pause .i-play{display:none}.hv-pause[aria-pressed="true"] .i-play{display:block}.hv-pause[aria-pressed="true"] .i-pause{display:none}
.hv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;pointer-events:none;opacity:0;transition:opacity var(--hvT,1s) ease}.hv.on{opacity:1}
.hero-shade{position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,var(--navy-deep) 0%,rgba(28,28,74,.85) 30%,rgba(28,28,74,0) 62%),linear-gradient(0deg,var(--navy-deep) 0%,rgba(28,28,74,0) 30%)}
.hero.short .hero-shade{display:none}
/* degradê regulável sobre vídeo e imagem */
.hero.ovr .hero-bg::after{display:none}
.hero.ovr .hero-shade{display:block;background:linear-gradient(90deg,rgba(var(--ovC),var(--ovL)) 0%,rgba(var(--ovC),var(--ovM)) 50%,rgba(var(--ovC),var(--ovR)) 100%),linear-gradient(0deg,rgba(28,28,74,var(--ovB)) 0%,rgba(28,28,74,0) 35%)}
@media (max-width:820px){.hero.ovr .hero-shade{background:linear-gradient(0deg,rgba(var(--ovC),var(--ovL)) 10%,rgba(var(--ovC),var(--ovM)) 55%,rgba(var(--ovC),var(--ovR)) 100%),linear-gradient(0deg,rgba(28,28,74,var(--ovB)) 0%,rgba(28,28,74,0) 35%)}}
.hero-inner{display:flex;flex-direction:column;justify-content:center;pointer-events:none}
.hero-inner > *{pointer-events:auto}
.hero.tall .hero-inner{min-height:clamp(540px,74vh,740px);padding-block:48px 40px}
.hero.short .hero-inner{padding-block:56px 64px;min-height:clamp(250px,22vw,380px)}
@media (max-width:820px){.hero.short .hero-inner{min-height:300px;padding-block:44px 48px}}
.hero h1{font-weight:500;font-size:clamp(2.3rem,5.4vw,4.5rem);max-width:13ch;margin-top:18px}
.hero.short h1{font-family:var(--pageTitle-f,var(--f-display));font-weight:var(--pageTitle-w,900);font-size:calc(clamp(2rem,4.6vw,3.6rem) * var(--pageTitle-k,1));max-width:20ch;margin-top:14px}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero-box{width:100%;max-width:var(--bw,540px);min-width:0;padding:clamp(20px,2.6vw,30px) clamp(16px,1.7vw,22px);background:rgba(28,28,74,var(--bo,.22));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:6px}
.hero-box.clear{background:none;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;padding-inline:0}
.hero-box h1,.hero-box .lead{max-width:none;text-align:justify;text-align-last:left;hyphens:auto;-webkit-hyphens:auto;text-wrap:wrap}
.hero-box h1{font-family:var(--heroTitle-f,var(--f-display));font-size:calc(clamp(1.75rem,3.3vw,2.85rem) * var(--heroTitle-k,1));line-height:1.08;margin-top:14px;word-spacing:-.02em;font-weight:var(--heroTitle-w,500)}
.hero-box .lead{font-weight:var(--lead-w,300)}
.hero-box .lead{margin-top:18px}
.hero-box h1 .ln{display:block;text-align:justify;text-align-last:justify}.hero-box h1 .ln.last{text-align-last:left}
.hero-box.fixed h1{font-size:clamp(calc(var(--hts) * .55px),calc(var(--hts) / 13.66 * 1vw),calc(var(--hts) * 1px))}
.hero h1 i{font-style:italic}.hero h1 b{font-weight:500}
.hero-box .ctas{margin-top:26px}
.hero .lead{max-width:52ch;margin-top:20px;font-family:var(--lead-f,inherit);font-size:calc(clamp(1.02rem,1.4vw,1.2rem) * var(--lead-k,1));color:rgba(255,255,255,.82);font-weight:var(--lead-w,300)}
.hero .eyebrow{color:var(--orange);display:flex;align-items:center;gap:10px}
.hero .eyebrow::before{content:"";width:28px;height:2px;background:currentColor}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;font-size:.82rem;color:rgba(255,255,255,.65)}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--orange)}
.crumbs span[aria-hidden]{opacity:.5}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;border:0;font-weight:500;font-size:.97rem;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s}
.btn-primary{background:var(--orange);color:#1F140F;box-shadow:0 10px 30px -8px rgba(255,144,18,.6)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.btn-ghost:hover{background:rgba(255,255,255,.16)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{transform:translateY(-2px)}
.btn-line{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.hero-hint{position:absolute;right:var(--gut-r);bottom:18px;font-family:var(--label-f,var(--f-data));font-size:.72rem;letter-spacing:var(--ls-label);text-transform:uppercase;color:rgba(255,255,255,.5);pointer-events:none}
@media (max-width:820px){.hero-shade{background:linear-gradient(0deg,var(--navy-deep) 8%,rgba(28,28,74,.75) 55%,rgba(28,28,74,.45) 100%)}.hero-hint{display:none}}

/* telemóvel: vídeo completo em 16:9 por baixo do menu, com o texto a seguir (mostra o enquadramento inteiro) */
.hv{object-position:var(--hvPos,50% 50%)}
@media (max-width:820px){
  .hero.vid.mwide{--vt:calc(var(--util-h) + var(--bar-h) + env(safe-area-inset-top,0px));--vb:calc(100vw * 9 / 16)}
  .hero.vid.mwide .hv,.hero.vid.mwide .hero-bg{inset:auto 0 auto 0;top:var(--vt);height:var(--vb)}
  .hero.vid.mwide .hero-shade{background:linear-gradient(180deg,rgba(28,28,74,.25) var(--vt),rgba(28,28,74,0) calc(var(--vt) + 30px),rgba(28,28,74,0) calc(var(--vt) + var(--vb) - 90px),var(--navy-deep) calc(var(--vt) + var(--vb)))!important}
  .hero.tall.vid.mwide .hero-inner{min-height:0;padding-top:calc(var(--vb) - 44px);padding-bottom:36px}
  .hero.short.vid.mwide .hero-inner{padding-top:calc(var(--vb) + 8px);padding-bottom:36px}
  .hero.vid.mwide .hv-play{top:calc(var(--vt) + 12px)}
  .hv-pause{right:auto;left:16px;bottom:auto;top:calc(var(--util-h) + var(--bar-h) + env(safe-area-inset-top,0px) + 12px)}
  .hero.vid.mwide .hv-pause{top:calc(var(--vt) + 12px)}
  .hv-pause.hv-next{right:auto;left:70px}
}
/* ---------- Distâncias + localização (mapa real) ---------- */
.geo{background:var(--navy-deep);color:#fff;position:relative;overflow:hidden}
.geo .eyebrow{color:var(--orange)}
.geo-head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px 56px;align-items:end;margin-bottom:28px}
.geo-head>p{color:rgba(255,255,255,.72);margin:0}
.geo-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:stretch}

.map .port text{fill:var(--accent);font:500 15px var(--f-display);letter-spacing:var(--ls-unit)}
.map .cap{position:absolute;left:14px;bottom:10px;font-size:.72rem;color:var(--muted)}
.map .loc-img{position:absolute;inset:0;background-size:cover;background-position:center}

/* facility cards */
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;perspective:1200px}

@media (max-width:640px){.terms{grid-template-columns:1fr}}
.tcard{--rx:0deg;--ry:0deg;position:relative;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .25s ease-out,box-shadow .3s;display:flex;flex-direction:column}

.tph .big{font-family:var(--numbers-f,var(--f-display));font-weight:var(--numbers-w,500);font-size:calc(clamp(2.6rem,5.5vw,4.2rem) * var(--numbers-k,1));line-height:.9;transform:translateZ(40px);font-variant-numeric:tabular-nums}

.tbody{padding:22px 22px 24px;display:flex;flex-direction:column;gap:10px;flex:1;transform:translateZ(20px)}
.tbody h3{font-weight:var(--sub-w,500);font-size:calc(1.45rem * var(--sub-k,1))}

.tcard:hover .topen svg{transform:translateX(4px)}
.badge{display:inline-flex;align-self:flex-start;font-family:var(--label-f,var(--f-data));font-weight:var(--label-w,500);font-size:calc(.7rem * var(--label-k,1));letter-spacing:var(--ls-label);text-transform:uppercase;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--accent-ink)}
.tmedia .badge{position:absolute;left:16px;top:16px;background:rgba(255,144,18,.95);color:#1F140F;z-index:2}

/* specs */
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}

/* page body */

/* texto corrido: um único padrão para páginas, notícias e localização (v2.14) */
.prose{display:block;width:100%;max-width:none;font-size:1em;line-height:1.7;text-align:left;overflow-wrap:break-word;hyphens:manual}
.prose>*{margin-top:0;margin-bottom:0}.prose>*+*{margin-top:1em}

.prose>h2+*,.prose>h3+*,.prose>h4+*{margin-top:.55em}
.prose::after{content:"";display:block;clear:both}
.prose figure.rimg{margin-left:0;margin-right:0}
.prose figure.rimg img{display:block;width:100%;height:auto;border-radius:10px;background:var(--surface-2)}
.prose figcaption{font-size:.85em;color:var(--muted);margin-top:6px}
.rw-25{width:25%}.rw-33{width:33.333%}.rw-50{width:50%}.rw-75{width:75%}.rw-100{width:100%}
.ra-center{margin-left:auto!important;margin-right:auto!important}
.ra-left{float:left;margin:4px 22px 12px 0!important}.ra-right{float:right;margin:4px 0 12px 22px!important}
.rw-100.ra-left,.rw-100.ra-right{float:none;margin:16px 0 0!important}
@media (max-width:600px){.prose figure.rimg{float:none;width:100%;margin:16px 0 0!important}}
.prose h3{font-size:calc(1.35rem * var(--sub-k,1))}
.prose ul{margin:0;padding-left:20px;display:grid;gap:6px}
.prose a{color:var(--accent);text-underline-offset:3px}
.aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(var(--bar-h) + 24px)}
.aside .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.aside h4{font-family:var(--label-f,var(--f-data));font-weight:var(--label-w,500);font-size:calc(.75rem * var(--label-k,1));letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--muted)}
.aside nav{display:flex;flex-direction:column}
.aside nav a{text-decoration:none;padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}

.aside nav a[aria-current="page"]{color:var(--accent-ink);font-weight:500}
.pcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;perspective:1200px}
.pcard .tbody{padding:18px 18px 20px;gap:8px}
.pcard .tbody h3{font-size:calc(1.15rem * var(--sub-k,1));line-height:1.25}
.pcard .tbody p{font-size:.92em;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pcard .tph .pc-num{font-family:var(--numbers-f,var(--f-display));font-weight:var(--numbers-w,500);font-size:3rem;line-height:1;color:var(--orange)}

@media (max-width:1100px){.pcards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.pcards{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}
@media (max-width:520px){.pcards{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:8px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;transition:transform .25s,box-shadow .25s}
.vcard:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.vcard i{width:34px;height:34px;border-radius:10px;background:var(--navy);display:grid;place-items:center;color:var(--orange);font-style:normal;font-family:var(--f-display);font-weight:500}
.vcard h4{font-size:calc(1.15rem * var(--sub-k,1));font-weight:var(--sub-w,500)}
.vcard p{color:var(--muted);font-size:.93em}
.docs{display:flex;flex-direction:column;gap:10px}
.dsecs{display:flex;flex-direction:column;gap:56px}
.dsec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px}
.dsec-h h2{margin:0;font-size:clamp(1.35rem,2.2vw,1.8rem)}.dsec-h p{margin:6px 0 0;color:var(--muted);max-width:70ch}.dsec-h .n{color:var(--muted);font-size:.88rem;white-space:nowrap}
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.dcard{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit;min-height:190px;transition:border-color .2s,transform .2s,box-shadow .2s}
.dcard:hover{border-color:var(--orange);transform:translateY(-3px);box-shadow:0 14px 30px rgba(28,28,74,.12)}
.dcard .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dcard .ic{width:42px;height:52px;flex:0 0 auto;border-radius:7px;background:var(--navy);color:#fff;display:grid;place-items:end center;padding-bottom:7px;font:500 .62rem var(--f-data);letter-spacing:var(--ls-label);position:relative;overflow:hidden}
.dcard .ic::before{content:"";position:absolute;right:0;top:0;border:9px solid transparent;border-right-color:var(--surface);border-top-color:var(--surface)}

.dcard b{display:block;line-height:1.3;font-size:1rem}

@media (max-width:1100px){.dgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.dgrid{grid-template-columns:1fr}.dcard{min-height:0}}
.doc{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;transition:border-color .2s,transform .2s}
.doc:hover{border-color:var(--orange);transform:translateX(3px)}
.doc .ic{width:40px;height:48px;flex:0 0 auto;border-radius:6px;background:var(--navy);color:#fff;display:grid;place-items:end center;padding-bottom:6px;font:500 .62rem var(--f-data);letter-spacing:var(--ls-label);position:relative;overflow:hidden}
.doc .ic::before{content:"";position:absolute;right:0;top:0;border:8px solid transparent;border-right-color:var(--bg);border-top-color:var(--bg)}
.doc b{display:block;line-height:1.3}
.doc small{color:var(--muted)}
.doc .go{margin-left:auto;color:var(--accent);font-weight:500;font-size:.88rem;white-space:nowrap}

/* news / projects */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}

.ncard .tx{padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.ncard time,.meta{font-family:var(--label-f,var(--f-data));font-size:calc(.78rem * var(--label-k,1));letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--accent-ink);font-weight:500}
.ncard h3{font-size:calc(1.25rem * var(--sub-k,1));font-weight:var(--sub-w,500)}

.article{max-width:none}
.article .cover{border-radius:var(--r);overflow:hidden;margin-bottom:28px;aspect-ratio:21/9;max-height:560px;max-width:100%}
.article .cover img{width:100%;height:100%;object-fit:cover;display:block}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:500;color:var(--accent);margin-bottom:24px}

/* publications / magazine */
.pubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.pub{display:flex;flex-direction:column;gap:12px;text-decoration:none}
.pub .cv{aspect-ratio:3/4;max-width:100%;border-radius:10px;overflow:hidden;background:linear-gradient(160deg,#2E2E6F 0%,#1C1C4A 70%);color:#fff;position:relative;box-shadow:var(--shadow);transition:transform .35s}
.pub:hover .cv{transform:perspective(800px) rotateY(-8deg) translateY(-4px)}
.pub .cv img{width:100%;height:100%;object-fit:cover;display:block}

.pub .cv .ph span{font:500 2.6rem var(--f-display);color:var(--orange)}

.feature{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:40px;align-items:center;margin-bottom:56px}
@media (max-width:720px){.feature{grid-template-columns:1fr}}
.feature .pub{max-width:300px}
.feature h2{font-family:var(--section-f,var(--f-display));font-size:calc(clamp(1.8rem,3.5vw,2.6rem) * var(--section-k,1));font-weight:var(--section-w,500);margin:10px 0 14px}

/* gallery */
.gal{columns:3 260px;column-gap:14px}

.lb{position:fixed;inset:0;z-index:90;background:rgba(8,8,24,.96);display:grid;grid-template-rows:1fr auto;padding:max(16px,env(safe-area-inset-top,0px)) var(--gut-r) max(16px,env(safe-area-inset-bottom,0px)) var(--gut);color:#fff}

.gfil{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.gfil button{font:inherit;font-size:.9rem;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s}
.gfil button:hover{border-color:var(--orange)}.gfil button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.galbums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
@media (max-width:1100px){.galbums{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.galbums{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}
.gcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .3s,box-shadow .3s}

.gc-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
.gc-b h3{font-size:calc(1.08rem * var(--sub-k,1));font-weight:var(--sub-w,500);line-height:1.3}
.gc-meta{font-family:var(--label-f,var(--f-data));font-size:calc(.72rem * var(--label-k,1));letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--accent-ink);font-weight:500}
@media (max-width:760px){.gc-b{padding:10px 12px 12px}.gc-b h3{font-size:.95rem}}
.gempty{color:var(--muted)}
.galb-sum{max-width:none;color:var(--muted);margin:-8px 0 22px}
.gphotos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.gphotos{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.gphotos{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.gph{position:relative;display:block;padding:0;border:0;border-radius:12px;overflow:hidden;aspect-ratio:1;background:var(--surface-2);cursor:zoom-in}
.gph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.gph:hover img{transform:scale(1.05)}
.gph-c{position:absolute;inset:auto 0 0;padding:22px 10px 8px;color:#fff;font-size:.8rem;text-align:left;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent);opacity:0;transition:opacity .25s}
.gph:hover .gph-c,.gph:focus-visible .gph-c{opacity:1}@media (hover:none){.gph-c{display:none}}
.gph:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.lb .x,.lb .pv,.lb .nx{position:absolute;border:0;background:rgba(255,255,255,.12);color:#fff;width:48px;height:48px;border-radius:50%;font-size:22px}
.lb .x{top:max(16px,env(safe-area-inset-top,0px));right:var(--gut-r)}
.lb .pv{left:var(--gut);top:50%}.lb .nx{right:var(--gut-r);top:50%}

/* ícones e números: mesmo desenho */
.ico{width:44px;height:44px;flex:0 0 auto;border-radius:12px;background:var(--navy);color:var(--orange);display:grid;place-items:center;font:500 1.15rem/1 var(--numbers-f,var(--f-display));font-variant-numeric:tabular-nums}
.ico svg{width:22px;height:22px}
.spec .ico,.stat .ico,.vcard .ico,.ico{color:var(--orange)}
.ico.on-dark{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.stat .ico{margin-bottom:8px}
.spec .ico{width:38px;height:38px;border-radius:10px;margin-bottom:6px}.spec .ico svg{width:20px;height:20px}
.vcard .ico{margin-bottom:2px}
.cline dt{display:flex;align-items:center;gap:6px}.cline dt svg{flex:0 0 auto}
/* redes sociais */
.soc{display:flex;gap:6px;align-items:center}
.soc .si{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;opacity:.85;transition:opacity .2s,background .2s,color .2s;text-decoration:none}
.soc .si:hover{opacity:1;background:var(--orange);color:#1F140F}
.soc.big{gap:10px;flex-wrap:wrap}.soc.big .si{width:38px;height:38px;background:rgba(255,255,255,.1);opacity:1}
.nav .m-row .soc .si,.nav .m-row .si{color:var(--ink)}
/* títulos: imagem e cor */
.t-img-wrap{margin:10px 0 6px}.t-img{display:block;max-width:100%;height:auto}
.t-left{display:flex;align-items:center;gap:.4em}.t-left .t-img{flex:0 0 auto}
/* texto rico */
.prose h2{font-size:calc(1.65rem * var(--sub-k,1))}
.prose h4{font-size:calc(1.12rem * var(--sub-k,1))}
.prose ol{margin:0;padding-left:22px;display:grid;gap:6px}
.prose b,.prose strong{font-weight:600}
.prose blockquote{margin:6px 0;padding:6px 0 6px 18px;border-left:3px solid var(--orange);font-size:1.08em;color:var(--muted)}
.prose hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.tc-blue{color:#2E2E6F}.tc-orange{color:#FF9012}.tc-lightgrey{color:#D9D9E1}.tc-white{color:#fff}.tc-black{color:#1F140F}
.loc .body.prose{margin-top:22px}
/* pdf viewer */
.pdf-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pdf-tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:500}
.pdf-tabs button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.pdfv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.pdf-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pdf-bar h3{font-size:calc(1.2rem * var(--sub-k,1));font-weight:var(--sub-w,500)}
.pdf-bar .meta2{color:var(--muted);font-size:.86em}
.pdf-bar .tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pdf-bar .ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:38px;height:38px;padding:0 10px;font-weight:500}
.pdf-bar .btn{padding:9px 16px;font-size:.9rem}
.pdf-pages{background:var(--surface-2);max-height:min(82vh,1100px);overflow:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.pdf-pages canvas{display:block;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);max-width:none}
.pdf-pages .ph{background:#fff;opacity:.6}
.pdf-pages iframe{width:100%;height:78vh;border:0;background:#fff}
.pdf-msg{padding:40px 16px;color:var(--muted);text-align:center}
/* berth */
.berth{min-width:820px}
.berth td,.berth th{text-align:left}
.st{display:inline-flex;align-items:center;gap:6px;font-family:var(--label-f,var(--f-data));font-weight:500;font-size:.74rem;letter-spacing:var(--ls-label);text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--surface-2)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--steel)}
.st.berthed{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--accent-ink)}.st.berthed::before{background:var(--orange)}
.st.expected{color:var(--accent)}.st.expected::before{background:var(--accent)}
.updated{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:14px;color:var(--muted);font-size:.88rem}

/* contacts / forms */
.contact{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px;align-items:start}
@media (max-width:900px){.contact{grid-template-columns:1fr}}
.cinfo{background:var(--navy-deep);color:#fff;border-radius:18px;padding:clamp(24px,4vw,40px);display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
.cinfo::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:30px solid rgba(255,144,18,.12)}
.cline{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:baseline}
.cline dt{font-family:var(--label-f,var(--f-data));font-size:calc(.74rem * var(--label-k,1));letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--orange)}
.cline dd{margin:0;font-size:1.05em;white-space:pre-line;word-break:break-word;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.copy{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:999px;font-size:.72rem;padding:3px 10px;font-weight:500}
.copy:hover{background:rgba(255,255,255,.2)}
.cinfo .soc a{color:#fff;opacity:.8;text-decoration:none}.cinfo .soc a:hover{opacity:1;color:var(--orange)}
.cinfo .btn{align-self:flex-start;z-index:1}
form.fm{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3.5vw,36px);display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
form.fm h3{font-size:calc(1.5rem * var(--sub-k,1));font-weight:var(--sub-w,500)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-weight:500;font-size:.86rem}
.fld input,.fld textarea,.fld select{font:inherit;font-size:.98rem;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.fld textarea{min-height:140px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--orange);outline-offset:0;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.tg{display:flex;gap:10px;align-items:flex-start;font-size:.93rem}
.tg input{width:18px;height:18px;margin-top:3px;accent-color:var(--navy)}
.fmsg{padding:12px 14px;border-radius:10px;font-size:.93rem}
.fmsg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.fmsg.err{background:color-mix(in srgb,var(--err) 12%,transparent);color:var(--err)}
form.fm .btn{align-self:flex-start}
/* contactos personalizáveis (v2.15) */
.contact{--ct-r:18px}
.contact.c-r-square{--ct-r:4px}.contact.c-r-soft{--ct-r:10px}.contact.c-r-round{--ct-r:18px}.contact.c-r-pill{--ct-r:28px}
.contact .cinfo,.contact form.fm{border-radius:var(--ct-r)}
.contact.c-eq{align-items:stretch}
.contact.c-rev>.cinfo{order:2}
.contact.c-stack{grid-template-columns:minmax(0,1fr)}
.contact.c-stack .cinfo dl{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px 28px!important}
.contact.c-stack .cline{grid-template-columns:1fr;gap:6px}
.contact.c-nodecor .cinfo::after{display:none}
.contact .ct-intro{color:var(--muted);margin-top:-6px}
/* caixa de contactos: clara, fotografia ou simples */
.contact.c-i-light .cinfo{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.contact.c-i-light .cinfo::after{border-color:rgba(255,144,18,.14)}
.contact.c-i-light .cline dt,.contact.c-i-plain .cline dt{color:var(--accent-ink,var(--navy))}
.contact.c-i-light .copy,.contact.c-i-plain .copy{background:var(--surface-2);color:var(--ink)}
.contact.c-i-light .copy:hover,.contact.c-i-plain .copy:hover{background:var(--line)}
.contact.c-i-light .cinfo .soc a,.contact.c-i-plain .cinfo .soc a{color:var(--ink)}
.contact.c-i-plain .cinfo{background:none;color:var(--ink);padding:0;border-radius:0;overflow:visible}
.contact.c-i-plain .cinfo::after{display:none}
.contact.c-i-plain .cline{padding-bottom:16px;border-bottom:1px solid var(--line)}
.contact.c-i-photo .cinfo{background:linear-gradient(180deg,rgba(28,28,74,.72),rgba(28,28,74,.94)),var(--ct-img,none) center/cover,var(--navy-deep)}
.contact.c-i-orange .cline dt{color:#fff}.contact.c-i-orange .cinfo{background:var(--orange);color:#1F140F}.contact.c-i-orange .cline dt{color:#1F140F;opacity:.7}.contact.c-i-orange .copy{background:rgba(0,0,0,.1);color:#1F140F}.contact.c-i-orange .cinfo .soc a{color:#1F140F}.contact.c-i-orange .cinfo::after{border-color:rgba(255,255,255,.25)}.contact.c-i-orange .cinfo .btn-primary{background:#1F140F;color:#fff;box-shadow:none}
/* caixa do formulário */
.contact.c-f-flat form.fm{background:var(--surface-2);border-color:transparent;box-shadow:none}
.contact.c-f-plain form.fm{background:none;border:0;box-shadow:none;padding:0;border-radius:0}
.contact.c-f-navy form.fm{background:var(--navy-deep);border-color:transparent;color:#fff}
.contact.c-f-navy .fld input,.contact.c-f-navy .fld textarea{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);color:#fff}
.contact.c-f-navy .tg input{accent-color:var(--orange)}
/* campos */
.contact.c-fl-outline .fld input,.contact.c-fl-outline .fld textarea{background:var(--surface);border-color:var(--line)}
.contact.c-fl-outline.c-f-navy .fld input,.contact.c-fl-outline.c-f-navy .fld textarea{background:transparent;border-color:rgba(255,255,255,.3)}
.contact.c-fl-line .fld input,.contact.c-fl-line .fld textarea{background:transparent;border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding-inline:0}
.contact.c-fl-line.c-f-navy .fld input,.contact.c-fl-line.c-f-navy .fld textarea{border-bottom-color:rgba(255,255,255,.3)}
.contact.c-fl-line .fld input:focus,.contact.c-fl-line .fld textarea:focus{outline:0;border-bottom-color:var(--orange)}
.contact:not(.c-fl-line) .fld input,.contact:not(.c-fl-line) .fld textarea{border-radius:max(4px,calc(var(--ct-r) * .55))}

/* banner pop-up */
.pop{position:fixed;z-index:70;font-family:var(--body-f,var(--f-body))}
.pop.card{left:max(18px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 36px))}
.pop.card.right{left:auto;right:max(18px,env(safe-area-inset-right,0px))}
.pop.center{inset:0;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.pop-bd{position:absolute;inset:0;background:rgba(14,14,32,.5);opacity:0;transition:opacity .25s;cursor:pointer}
.pop.in .pop-bd{opacity:1}
.pop-c{position:relative;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 24px 60px -16px rgba(14,14,40,.5);opacity:0;transform:translateY(16px);transition:opacity .25s ease,transform .25s ease}
.pop.in .pop-c{opacity:1;transform:none}.pop.out .pop-c{opacity:0;transform:translateY(10px)}
.pop.center .pop-c{width:min(560px,100%);max-height:min(86vh,760px)}
.pop.card .pop-c{max-height:min(72vh,620px)}
.pop-img{display:block;flex:0 1 auto;min-height:0;background:var(--surface-2)}
.pop-img img{display:block;width:100%;height:100%;max-height:min(56vh,480px);object-fit:contain}
.pop.card .pop-img img{max-height:min(38vh,300px);object-fit:cover}
.pop.img-only .pop-img img{max-height:min(86vh,760px)}.pop.card.img-only .pop-img img{max-height:min(66vh,560px);object-fit:contain}
.pop-b{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.pop-b h2{font-size:calc(1.3rem * var(--sub-k,1));font-weight:var(--sub-w,500);line-height:1.25;padding-right:28px}
.pop-img+.pop-b h2{padding-right:0}
.pop-b p{color:var(--muted);font-size:.95rem;line-height:1.55;margin:0;white-space:pre-line}
.pop-cta{align-self:flex-start;margin-top:6px;padding:11px 18px;font-size:.92rem}
.pop-x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(14,14,32,.62);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pop-x:hover,.pop-x:focus-visible{background:var(--orange);color:#1F140F;outline:none}
@media (max-width:600px){.pop.card{left:10px;right:10px;width:auto;bottom:max(10px,env(safe-area-inset-bottom,0px))}.pop.card .pop-c{max-height:62vh}.pop.card .pop-img img{max-height:30vh}
  .pop.card .pop-c::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:rgba(255,255,255,.7);z-index:1;box-shadow:0 0 0 1px rgba(0,0,0,.08)}}
@media (prefers-reduced-motion:reduce){.pop-c,.pop-bd{transition:none}}
@media print{.pop{display:none}}

/* assistente virtual */
.faq{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:60;font-family:var(--body-f,var(--f-body))}
.faq.left{right:auto;left:max(18px,env(safe-area-inset-left,0px))}
.faq-fab{width:58px;height:58px;border-radius:50%;border:0;background:var(--orange);color:#1F140F;display:grid;place-items:center;cursor:pointer;box-shadow:0 12px 30px -8px rgba(255,144,18,.65),0 2px 6px rgba(0,0,0,.18);transition:transform .2s}
.faq-fab:hover{transform:translateY(-2px)}.faq-fab:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.faq-fab-x{display:none;font-size:30px;line-height:1}.faq.open .faq-fab svg{display:none}.faq.open .faq-fab-x{display:block}
.faq-panel{position:absolute;right:0;bottom:72px;width:min(390px,calc(100vw - 36px));height:min(580px,calc(100vh - 120px));display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px -18px rgba(20,20,60,.45);overflow:hidden}
.faq.left .faq-panel{right:auto;left:0}.faq-panel[hidden]{display:none}
.faq-h{display:flex;align-items:center;gap:12px;padding:16px 14px 16px 18px;background:var(--navy-deep);color:#fff}
.faq-h b{display:block;font-weight:500;font-size:1.02rem}.faq-h small{display:block;font-size:.74rem;color:rgba(255,255,255,.6);font-family:var(--label-f,var(--f-data));letter-spacing:var(--ls-label);text-transform:uppercase}
.faq-av{width:38px;height:38px;border-radius:50%;background:var(--orange);color:#1F140F;display:grid;place-items:center;flex:0 0 auto}
.faq-x{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:24px;line-height:1;cursor:pointer}.faq-x:hover{background:rgba(255,255,255,.2)}
.faq-log{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px;background:var(--bg);overscroll-behavior:contain}
.faq-m{max-width:88%;padding:11px 14px;border-radius:14px;font-size:.94rem;line-height:1.55}
.faq-m p{margin:0}.faq-m p+p{margin-top:.6em}
.faq-m.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.faq-m.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.faq-m a{color:var(--accent)}
.faq-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.faq-chip{font:inherit;font-size:.84rem;text-align:left;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer}
.faq-chip:hover{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 10%,var(--surface))}
.faq-more{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.faq-more>span{font-size:.74rem;color:var(--muted);font-family:var(--label-f,var(--f-data));letter-spacing:var(--ls-label);text-transform:uppercase}
.faq-go{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-weight:500;font-size:.88rem;color:var(--accent);text-decoration:none}.faq-go svg{width:14px;height:14px}.faq-go:hover{text-decoration:underline}
.faq-acts{display:flex;flex-wrap:wrap;gap:4px 16px}
.faq-in{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--surface)}
.faq-in input{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink)}
.faq-in input:focus{outline:2px solid var(--orange);border-color:transparent}
.faq-in button{width:44px;height:44px;border-radius:50%;border:0;background:var(--navy);color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
@media (max-width:600px){.faq.open{inset:0;right:0;bottom:0}.faq.open .faq-panel{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border-radius:0;border:0}.faq.open .faq-fab{display:none}html.faq-lock,html.faq-lock body{overflow:hidden}}
@media print{.faq{display:none}}

/* footer */
footer{background:var(--coal);color:#E9E6E3;padding-block:56px 28px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) footer{background:#08081A}}
:root[data-theme="dark"] footer{background:#08081A}
.fgrid{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:32px}
@media (max-width:900px){.fgrid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
footer .brand{height:52px;color:#fff}
footer h4{font-family:var(--label-f,var(--f-data));font-weight:var(--label-w,500);font-size:calc(.75rem * var(--label-k,1));letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--orange);margin:0 0 14px}
footer p,footer li{color:rgba(233,230,227,.75);font-size:.93em}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
footer a{text-decoration:none}footer a:hover{color:var(--orange)}
footer .soc{margin-top:18px;flex-wrap:wrap}
.fbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:44px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);font-size:.82rem;color:rgba(233,230,227,.55)}
.fbar .lang{color:#E9E6E3}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-weight:500;font-size:.9rem;box-shadow:var(--shadow)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
/* ---------- padrão único de cartões: 4 por linha, imagem 16:11, título, breve introdução, "Saiba mais" ---------- */
.pcards,.terms,.grid3,.pubs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;perspective:1200px}
@media (max-width:1100px){.pcards,.terms,.grid3,.pubs{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.pcards,.terms,.grid3,.pubs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}
@media (max-width:520px){.pcards,.terms,.grid3{grid-template-columns:1fr}}
.tcard .tbody,.ncard .tx{padding:18px 18px 20px;gap:8px}
.tcard .tbody h3,.ncard h3{font-size:calc(1.15rem * var(--sub-k,1));line-height:1.25}
.tcard .tbody p,.ncard p{font-size:.92em;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ncard{border-radius:18px;box-shadow:var(--shadow)}
.ncard .im{aspect-ratio:16/11}
.ncard .im .badge{position:absolute;left:16px;top:16px;background:rgba(255,144,18,.95);color:#1F140F;z-index:2}
.ncard .topen{margin-top:auto;padding-top:8px}
.ncard:hover .topen svg{transform:translateX(4px)}
.tph .big{font-size:calc(clamp(1.8rem,2.6vw,2.6rem) * var(--numbers-k,1))}
/* ---------- grelha de 3 fotografias ---------- */
.pgrid{display:grid;gap:12px}
.art-photos{margin-top:28px}
.pgrid.mosaic.n3{grid-template-columns:1.6fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));aspect-ratio:16/9}
.pgrid.mosaic.n3 .pg-slot:first-child{grid-row:span 2}
.pgrid.row.n3,.pgrid.mosaic.n2,.pgrid.row.n2{grid-template-columns:repeat(var(--c,3),minmax(0,1fr))}.pgrid.n2{--c:2}
.pgrid.row .pg-slot,.pgrid.n2 .pg-slot,.pgrid.n1 .pg-slot{aspect-ratio:4/3}.pgrid.n1 .pg-slot{aspect-ratio:16/9}
.pg-slot{position:relative;display:block;padding:0;border:0;border-radius:14px;overflow:hidden;cursor:zoom-in;background:var(--navy);min-height:0}
.pg-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .8s}
.pg-slot img.pg-in{opacity:0}.pg-slot img.pg-in.on{opacity:1}
.pg-slot:hover img{transform:scale(1.06)}
.pg-slot::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(28,28,74,.7),rgba(28,28,74,0) 45%);opacity:.0;transition:opacity .3s}
.pg-slot:hover::after,.pg-slot:focus-visible::after{opacity:1}
.pg-cap{position:absolute;left:14px;right:52px;bottom:12px;z-index:2;color:#fff;font-size:.86rem;text-align:left;opacity:0;transform:translateY(6px);transition:.3s}
.pg-slot:hover .pg-cap,.pg-slot:focus-visible .pg-cap{opacity:1;transform:none}
.pg-zoom{position:absolute;right:10px;bottom:10px;z-index:2;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--navy);display:grid;place-items:center;opacity:0;transform:scale(.8);transition:.3s}
.pg-slot:hover .pg-zoom,.pg-slot:focus-visible .pg-zoom{opacity:1;transform:none}
@media (hover:none){.pg-cap{opacity:1;transform:none}.pg-slot::after{opacity:1}}
@media (max-width:640px){.pgrid.mosaic.n3{aspect-ratio:4/5;grid-template-columns:1fr 1fr;grid-template-rows:1.4fr 1fr}.pgrid.mosaic.n3 .pg-slot:first-child{grid-row:auto;grid-column:span 2}.pgrid.row.n3{grid-template-columns:1fr 1fr}.pgrid.row.n3 .pg-slot:first-child{grid-column:span 2;aspect-ratio:16/9}}
.m-tools{display:none}
@media (max-width:1180px){
  .m-tools{display:flex;align-items:center;gap:10px;margin-left:auto}
  .m-tools+.menu-btn{margin-left:2px}
  .m-tools .wx{font-size:.82rem;opacity:1}
  .m-tools .lang button{padding:3px 9px}
}
@media (max-width:520px){.wx-m span{display:none}.m-tools{gap:8px}.brand{height:40px}.brand img{max-width:40vw}}
@media (max-width:400px){.brand img{max-width:36vw}.m-tools .lang button{padding:3px 7px}}
@media (max-width:350px){.wx-m svg{display:none}}
/* item de menu com página própria + submenu: o texto abre a página, a seta abre o submenu */
.nav li.split{display:flex;align-items:center}
.nav li.split>.top-a{padding-right:4px}
.nav .sub-t{display:inline-grid;place-items:center;width:26px;height:30px;margin-left:-2px;border:0;background:none;color:inherit;border-radius:999px;cursor:pointer;padding:0}
.nav .sub-t:hover,.nav li.split:focus-within>.sub-t{background:color-mix(in srgb,currentColor 12%,transparent)}
.nav>ul>li.split:hover>.sub-t .chev,.nav>ul>li.split.open>.sub-t .chev{transform:rotate(180deg)}
.sub li.split>.sub-a{flex:1;display:flex;padding:10px 12px;border-radius:9px;text-decoration:none;font-family:var(--nav-f,inherit);font-weight:var(--nav-w,500);font-size:calc(.93rem * var(--nav-k,1))}
.sub li.split>.sub-a:hover{background:var(--surface-2)}.sub li.split>.sub-a.cur{color:var(--accent-ink)}
.sub li.split>.sub-t{width:30px;height:34px;border-radius:9px}
@media (min-width:1181px){.sub li.split>.sub-t .chev{transform:rotate(-90deg)}.has-sub.rt .sub li.split>.sub-t .chev{transform:rotate(90deg)}}
@media (max-width:1180px){
  .nav li.split{flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .nav li.split>.top-a{flex:1;width:auto;border-bottom:0}
  .nav li.split>.sub-t{width:48px;height:48px;border-radius:10px}
  .nav li.split>.sub{flex-basis:100%}
  .sub li.split{border-bottom:0}.sub li.split>.sub-a{padding:12px 8px;font-size:calc(1rem * var(--nav-k,1))}
  .nav li.split.open>.sub-t .chev{transform:rotate(180deg)}
}
</style>
