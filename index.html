<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Port of Beira</title>
<meta name="description" content="Cornelder de Moçambique — the shortest, quickest and safest route to the sea for the southern Africa hinterland.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;700;900&family=Fira+Sans+Condensed:wght@500;700;800&display=swap">
<style id="font-faces">
/* Dax: usa a fonte instalada; os ficheiros carregados no CMS substituem isto */
@font-face{font-family:"Dax";src:local("Dax-Light"),local("Dax Light");font-weight:300}
@font-face{font-family:"Dax";src:local("Dax-Regular"),local("Dax Regular"),local("Dax");font-weight:400}
@font-face{font-family:"Dax";src:local("Dax-Medium"),local("Dax Medium");font-weight:500}
@font-face{font-family:"Dax";src:local("Dax-Bold"),local("Dax Bold");font-weight:700}
@font-face{font-family:"Dax";src:local("Dax-Black"),local("Dax Black");font-weight:900}
</style>
<style id="font-uploads"></style>
<style>
/* Layout: dark quay-side hero band (3D container yard on home), then light "port document" pages on a navy-tinted ground */
:root{
  --navy:#2E2E6F; --navy-deep:#1C1C4A; --orange:#FF9012; --coal:#1F140F; --steel:#A1A1AC;
  --bg:#F4F4F8; --surface:#FFFFFF; --surface-2:#ECECF3; --ink:#1B1A33; --muted:#5F5F74; --line:#D9D9E4;
  --accent:#2E2E6F; --accent-ink:#B35F00; --bar:#C9C9D6; --ok:#1E7B4F; --err:#B42318;
  --shadow:0 1px 2px rgba(30,30,80,.06),0 12px 32px -12px rgba(30,30,80,.18);
  --f-display:"Dax","Fira Sans Condensed","Fira Sans",system-ui,sans-serif;
  --f-body:"Dax","Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"Fira Sans Condensed","Dax","Fira Sans",system-ui,sans-serif;
  --r:14px; --side:8cm; --gut:max(16px,env(safe-area-inset-left,0px),min(var(--side),calc((100vw - 1240px) / 2))); --gut-r:max(16px,env(safe-area-inset-right,0px),min(var(--side),calc((100vw - 1240px) / 2)));
  --util-h:38px; --bar-h:72px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E20; --surface:#16163A; --surface-2:#1E1E48; --ink:#ECECF5; --muted:#A1A1AC; --line:#2C2C5C;
  --accent:#A9A9F0; --accent-ink:#FFA640; --bar:#3A3A6E; --ok:#4CC38A; --err:#FF7A6E; --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E20; --surface:#16163A; --surface-2:#1E1E48; --ink:#ECECF5; --muted:#A1A1AC; --line:#2C2C5C;
  --accent:#A9A9F0; --accent-ink:#FFA640; --bar:#3A3A6E; --ok:#4CC38A; --err:#FF7A6E; --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body-f,var(--f-body));font-weight:var(--body-w,400);font-size:calc(17px * var(--body-k,1));line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--section-f,var(--f-display))}h3,h4{font-family:var(--sub-f,var(--f-display))}
.prose,.sec-head p,.loc .body,.tbody p,.ncard p,.vcard p{font-family:var(--body-f,var(--f-body))}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}
.wrap{max-width:none;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r)}
.eyebrow{font-family:var(--label-f,var(--f-data));font-weight:var(--label-w,700);font-size:calc(.78rem * var(--label-k,1));letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Header ---------- */
.hdr{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top,0px);color:#fff;transition:background .3s,box-shadow .3s,color .3s}
.util{height:var(--util-h);border-bottom:1px solid rgba(255,255,255,.1);font-family:var(--nav-f,inherit);font-size:calc(.82rem * var(--nav-k,1));transition:height .3s,opacity .3s;overflow:hidden}
.util-in{height:100%;display:flex;align-items:center;gap:20px}
.util nav{display:flex;gap:18px}
.util a{text-decoration:none;opacity:.8}.util a:hover,.util a[aria-current="page"]{opacity:1;color:var(--orange)}
.util-r{margin-left:auto;display:flex;align-items:center;gap:16px}
.soc{display:flex;gap:12px}
.lang{display:inline-flex;border-radius:999px;box-shadow:inset 0 0 0 1px currentColor;padding:2px;gap:2px;opacity:.9}
.lang button{border:0;background:none;padding:2px 9px;border-radius:999px;font-family:var(--label-f,var(--f-data));font-weight:700;font-size:.72rem;letter-spacing:.08em}
.lang button[aria-pressed="true"]{background:var(--orange);color:#1F140F}
.bar{display:flex;align-items:center;gap:20px;height:var(--bar-h)}
.hdr:not(.solid):not(.open){background:var(--hbBg,none)}
.hdr.hb-blur:not(.solid):not(.open){backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hdr.solid{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.hdr.solid .util{height:0;opacity:0;border:0}
.brand{display:flex;align-items:center;text-decoration:none;min-width:0;height:50px;flex:0 1 auto}
.brand img{height:100%;width:auto;max-width:min(220px,58vw);object-fit:contain;object-position:left center}
.brand .lg-color{display:none}
.hdr.solid .brand .lg-color{display:block}.hdr.solid .brand .lg-white{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hdr.solid .brand .lg-color{display:none}:root:not([data-theme="light"]) .hdr.solid .brand .lg-white{display:block}}
:root[data-theme="dark"] .hdr.solid .brand .lg-color{display:none}:root[data-theme="dark"] .hdr.solid .brand .lg-white{display:block}
.wordmark{display:flex;flex-direction:column;line-height:1;font-family:var(--f-display)}
.wordmark b{font-weight:900;font-size:1.3rem;letter-spacing:.06em}
.wordmark small{font-weight:500;font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;opacity:.8;margin-top:4px}
.nav{margin-left:auto}
.nav>ul{list-style:none;margin:0;padding:0;display:flex;gap:2px;align-items:center}
.nav li{position:relative}
.nav .top-a{display:flex;align-items:center;gap:6px;text-decoration:none;font-family:var(--nav-f,inherit);font-weight:var(--nav-w,500);font-size:calc(.92rem * var(--nav-k,1));padding:8px 12px;border-radius:999px;border:0;background:none;white-space:nowrap}
.nav .top-a:hover,.nav li:focus-within>.top-a{background:color-mix(in srgb,currentColor 12%,transparent)}
.nav .top-a[aria-current="page"],.nav .top-a.cur{color:var(--orange)}
.hdr.solid .nav .top-a[aria-current="page"],.hdr.solid .nav .top-a.cur{color:var(--accent-ink)}
.nav .chev{width:10px;height:10px;transition:transform .2s}
.sub{list-style:none;margin:0;padding:8px;position:absolute;left:0;top:calc(100% + 8px);min-width:260px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translateY(6px);transition:.18s}
.sub::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px}
.sub a{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:9px;text-decoration:none;font-family:var(--nav-f,inherit);font-weight:var(--nav-w,500);font-size:calc(.93rem * var(--nav-k,1))}
.sub a:hover,.sub a:focus-visible{background:var(--surface-2)}
.sub a[aria-current="page"]{color:var(--accent-ink);font-weight:700}
.sub a .ext{opacity:.5;font-size:.8em}
@media (hover:hover){.nav li.has-sub:hover>.sub{opacity:1;visibility:visible;transform:none}.nav li.has-sub:hover .chev{transform:rotate(180deg)}}
.nav li.open>.sub{opacity:1;visibility:visible;transform:none}
.nav li.open .chev{transform:rotate(180deg)}
.nav .m-only{display:none}
.menu-btn{display:none;margin-left:auto;background:none;border:0;width:44px;height:44px;border-radius:10px}
.menu-btn span{display:block;width:22px;height:2px;background:currentColor;margin:5px auto;transition:transform .25s,opacity .2s}
@media (max-width:1180px){
  :root{--util-h:0px}
  .util{display:none}
  .menu-btn{display:block}
  .nav{position:fixed;inset:calc(var(--bar-h) + env(safe-area-inset-top,0px)) 0 0;background:var(--surface);color:var(--ink);padding:8px var(--gut-r) calc(24px + env(safe-area-inset-bottom,0px)) var(--gut);overflow:auto;transform:translateX(100%);transition:transform .3s;visibility:hidden}
  .hdr.open .nav{transform:none;visibility:visible}
  .hdr.open{background:var(--surface);color:var(--ink)}
  .nav>ul{flex-direction:column;align-items:stretch;gap:0}
  .nav .top-a{width:100%;justify-content:space-between;font-size:calc(1.08rem * var(--nav-k,1));padding:14px 8px;border-radius:0;border-bottom:1px solid var(--line)}
  .sub{position:static;opacity:1;visibility:visible;transform:none;box-shadow:none;border:0;border-radius:0;padding:0 0 8px 12px;display:none;min-width:0;background:none}
  .nav li.open>.sub{display:block}
  .nav .m-only{display:block}
  .nav .m-row{display:flex;flex-wrap:wrap;gap:8px 18px;padding:18px 8px 6px;font-size:.92rem}
  .nav .m-row a{text-decoration:none;color:var(--muted)}
  .nav .m-row .lang{color:var(--ink)}
  .hdr.open .menu-btn span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .hdr.open .menu-btn span:nth-child(2){opacity:0}
  .hdr.open .menu-btn span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  .hdr.open .brand .lg-color{display:block}.hdr.open .brand .lg-white{display:none}
}

/* ---------- Hero band (always dark) ---------- */
.hero{position:relative;background:var(--navy-deep);color:#fff;overflow:hidden;isolation:isolate;padding-top:calc(var(--util-h) + var(--bar-h) + env(safe-area-inset-top,0px))}
.hero-bg{position:absolute;inset:0;z-index:-3;background-size:cover;background-position:center}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(28,28,74,.94) 0%,rgba(28,28,74,.72) 50%,rgba(28,28,74,.4) 100%)}
.hero-grid{position:absolute;inset:0;z-index:-3;opacity:.35;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 70% 60%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 70% 60%,#000 20%,transparent 75%)}
.hv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;pointer-events:none;opacity:0;transition:opacity var(--hvT,1s) ease}.hv.on{opacity:1}
#hero3d{position:absolute;inset:0;z-index:-2}
#hero3d canvas{display:block;width:100%!important;height:100%!important}
.hero-shade{position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,var(--navy-deep) 0%,rgba(28,28,74,.85) 30%,rgba(28,28,74,0) 62%),linear-gradient(0deg,var(--navy-deep) 0%,rgba(28,28,74,0) 30%)}
.hero.short .hero-shade{display:none}
/* degradê regulável sobre vídeo e imagem */
.hero.ovr .hero-bg::after{display:none}
.hero.ovr .hero-shade{display:block;background:linear-gradient(90deg,rgba(var(--ovC),var(--ovL)) 0%,rgba(var(--ovC),var(--ovM)) 50%,rgba(var(--ovC),var(--ovR)) 100%),linear-gradient(0deg,rgba(28,28,74,var(--ovB)) 0%,rgba(28,28,74,0) 35%)}
@media (max-width:820px){.hero.ovr .hero-shade{background:linear-gradient(0deg,rgba(var(--ovC),var(--ovL)) 10%,rgba(var(--ovC),var(--ovM)) 55%,rgba(var(--ovC),var(--ovR)) 100%),linear-gradient(0deg,rgba(28,28,74,var(--ovB)) 0%,rgba(28,28,74,0) 35%)}}
.hero-inner{display:flex;flex-direction:column;justify-content:center;pointer-events:none}
.hero-inner > *{pointer-events:auto}
.hero.tall .hero-inner{min-height:clamp(540px,74vh,740px);padding-block:48px 40px}
.hero.short .hero-inner{padding-block:44px 52px}
.hero h1{font-weight:900;font-size:clamp(2.3rem,5.4vw,4.5rem);max-width:13ch;margin-top:18px}
.hero.short h1{font-family:var(--pageTitle-f,var(--f-display));font-weight:var(--pageTitle-w,900);font-size:calc(clamp(2rem,4.6vw,3.6rem) * var(--pageTitle-k,1));max-width:20ch;margin-top:14px}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero-box{width:100%;max-width:var(--bw,540px);min-width:0;padding:clamp(20px,2.6vw,30px) clamp(16px,1.7vw,22px);background:rgba(28,28,74,var(--bo,.22));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:6px}
.hero-box.clear{background:none;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;padding-inline:0}
.hero-box h1,.hero-box .lead{max-width:none;text-align:justify;text-align-last:left;hyphens:auto;-webkit-hyphens:auto;text-wrap:wrap}
.hero-box h1{font-family:var(--heroTitle-f,var(--f-display));font-size:calc(clamp(1.75rem,3.3vw,2.85rem) * var(--heroTitle-k,1));line-height:1.08;margin-top:14px;word-spacing:-.02em;font-weight:var(--heroTitle-w,500)}
.hero-box .lead{font-weight:var(--lead-w,300)}
.hero-box .lead{margin-top:18px}
.hero-box h1 .ln{display:block;text-align:justify;text-align-last:justify}.hero-box h1 .ln.last{text-align-last:left}
.hero-box.fixed h1{font-size:clamp(calc(var(--hts) * .55px),calc(var(--hts) / 13.66 * 1vw),calc(var(--hts) * 1px))}
.hero h1 i{font-style:italic}.hero h1 b{font-weight:800}
.hero-box .ctas{margin-top:26px}
.hero .lead{max-width:52ch;margin-top:20px;font-family:var(--lead-f,inherit);font-size:calc(clamp(1.02rem,1.4vw,1.2rem) * var(--lead-k,1));color:rgba(255,255,255,.82);font-weight:var(--lead-w,300)}
.hero .eyebrow{color:var(--orange);display:flex;align-items:center;gap:10px}
.hero .eyebrow::before{content:"";width:28px;height:2px;background:currentColor}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;font-size:.82rem;color:rgba(255,255,255,.65)}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--orange)}
.crumbs span[aria-hidden]{opacity:.5}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;border:0;font-weight:700;font-size:.97rem;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s}
.btn-primary{background:var(--orange);color:#1F140F;box-shadow:0 10px 30px -8px rgba(255,144,18,.6)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.btn-ghost:hover{background:rgba(255,255,255,.16)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{transform:translateY(-2px)}
.btn-line{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.hero-hint{position:absolute;right:var(--gut-r);bottom:18px;font-family:var(--label-f,var(--f-data));font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);pointer-events:none}
@media (max-width:820px){.hero-shade{background:linear-gradient(0deg,var(--navy-deep) 8%,rgba(28,28,74,.75) 55%,rgba(28,28,74,.45) 100%)}.hero-hint{display:none}}

/* ---------- Stats ---------- */
.stats{background:var(--navy);color:#fff}
.stats .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{padding:28px 20px 26px;border-left:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:6px}
.stat:first-child{border-left:0;padding-left:0}
.stat .v{font-family:var(--numbers-f,var(--f-display));font-weight:var(--numbers-w,900);font-size:calc(clamp(1.9rem,3vw,2.6rem) * var(--numbers-k,1));line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:.42em;font-weight:700;color:var(--orange);margin-left:6px;letter-spacing:.04em}
.stat .l{font-size:.9em;color:rgba(255,255,255,.72);max-width:26ch}
@media (max-width:620px){.stats .wrap{grid-template-columns:1fr 1fr}.stat{padding:22px 12px}.stat:nth-child(odd){border-left:0;padding-left:0}.stat:nth-child(n+3){border-top:1px solid rgba(255,255,255,.12)}}

/* ---------- Sections ---------- */
section.block{padding-block:clamp(56px,8vw,104px)}
section.block+section.block{padding-top:0}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 64px;align-items:end;margin-bottom:44px}
.sec-head h2{font-family:var(--section-f,var(--f-display));font-weight:var(--section-w,900);font-size:calc(clamp(2rem,4vw,3.1rem) * var(--section-k,1));margin-top:12px}
.sec-head p{color:var(--muted);max-width:52ch}
@media (max-width:820px){.sec-head{grid-template-columns:1fr}}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:44px 24px;text-align:center;color:var(--muted);background:var(--surface)}
.empty b{display:block;font-family:var(--f-display);font-size:1.3rem;color:var(--ink);margin-bottom:6px}

/* distances */
.dist{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:900px){.dist{grid-template-columns:1fr}}
.dest-list{display:flex;flex-direction:column;gap:6px}
@media (max-width:900px){.dest-list{flex-direction:row;overflow-x:auto;padding-bottom:6px}.dest-list button{flex:0 0 auto}}
.dest-list button{display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;transition:border-color .2s,transform .2s,background .2s}
.dest-list button:hover{transform:translateX(3px)}
.dest-list button b{font-family:var(--f-display);font-size:1.08rem;font-weight:700;display:block;line-height:1.2}
.dest-list button small{color:var(--muted);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-family:var(--label-f,var(--f-data))}
.dest-list button .km{font-family:var(--label-f,var(--f-data));font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dest-list button[aria-pressed="true"]{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 10%,var(--surface))}
.dest-list button[aria-pressed="true"] .km{color:var(--accent-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,3vw,36px);box-shadow:var(--shadow);min-width:0}
.panel-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 24px;margin-bottom:28px}
.panel-top h3{font-size:calc(clamp(1.5rem,2.6vw,2rem) * var(--sub-k,1));font-weight:var(--sub-w,900)}
.panel-top h3 span{color:var(--muted);font-weight:500;font-size:.55em;letter-spacing:.14em;text-transform:uppercase;margin-left:8px;font-family:var(--label-f,var(--f-data))}
.saving{font-family:var(--label-f,var(--f-data));font-weight:700;color:var(--accent-ink)}
.bars{display:flex;flex-direction:column;gap:16px}
.bar-row{display:grid;grid-template-columns:130px minmax(0,1fr) 84px;gap:14px;align-items:center}
.bar-row .pn{font-weight:700;font-size:.95rem}
.bar-track{height:34px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;width:0;border-radius:8px;background:var(--bar);transition:width .8s cubic-bezier(.2,.8,.2,1);position:relative}
.bar-row.home .bar-fill{background:linear-gradient(90deg,var(--navy),#4747A8)}
.bar-row.home .bar-fill::after{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;background:var(--orange);border-radius:0 8px 8px 0}
.bar-row .bv{font-family:var(--label-f,var(--f-data));font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.bar-row.home .pn,.bar-row.home .bv{color:var(--accent)}
@media (max-width:520px){.bar-row{grid-template-columns:1fr auto;gap:6px 10px}.bar-track{grid-column:1/-1;grid-row:2;height:26px}}
.table-wrap{overflow-x:auto;margin-top:28px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.dtab{min-width:760px}
th,td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
thead th{font-family:var(--label-f,var(--f-data));font-size:.8rem;letter-spacing:.04em;vertical-align:bottom}
thead th small{display:block;color:var(--muted);font-weight:500;letter-spacing:.12em;font-size:.68rem;text-transform:uppercase}
tbody tr:last-child td{border-bottom:0}
tbody tr.home td{font-weight:700;color:var(--accent)}
tbody tr.home td:first-child{box-shadow:inset 4px 0 0 var(--orange)}
td.best{background:color-mix(in srgb,var(--orange) 14%,transparent)}
th.sel,td.sel{outline:2px solid var(--orange);outline-offset:-2px}
.note{font-size:.82em;color:var(--muted);margin-top:12px}

/* location */
.loc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px;align-items:center}
@media (max-width:900px){.loc{grid-template-columns:1fr}}
.loc h2{font-family:var(--section-f,var(--f-display));font-weight:var(--section-w,900);font-size:calc(clamp(2rem,4vw,3.1rem) * var(--section-k,1));margin-top:12px}
.loc .sub2{font-family:var(--label-f,var(--f-data));font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-size:.85rem;margin-top:10px}
.loc .body{margin-top:22px;max-width:56ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;font-size:.9em}
.loc .btn{margin-top:28px}
.map{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;aspect-ratio:1/1;max-width:100%}
.map svg{width:100%;height:100%;display:block}
.map .land{fill:var(--surface-2)}
.map .sea{fill:color-mix(in srgb,var(--navy) 12%,var(--surface))}
.map .route{stroke:var(--steel);stroke-width:1.6;fill:none;stroke-dasharray:4 6;transition:stroke .3s,stroke-width .3s}
.map .route.on{stroke:var(--orange);stroke-width:3;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.map .city circle{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.map .city text{fill:var(--ink);font:600 12px var(--f-data)}
.map .city .km{fill:var(--muted);font-weight:500;font-size:11px}
.map .city.on circle{fill:var(--orange);stroke:var(--orange)}
.map .city{cursor:pointer}
.map .port circle.core{fill:var(--orange)}
.map .port circle.pulse{fill:none;stroke:var(--orange);stroke-width:2;transform-origin:center;transform-box:fill-box;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(4);opacity:0}}
.map .port text{fill:var(--accent);font:900 15px var(--f-display);letter-spacing:.06em}
.map .cap{position:absolute;left:14px;bottom:10px;font-size:.72rem;color:var(--muted)}
.map .loc-img{position:absolute;inset:0;background-size:cover;background-position:center}

/* facility cards */
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;perspective:1200px}
@media (max-width:980px){.terms{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.terms{grid-template-columns:1fr}}
.tcard{--rx:0deg;--ry:0deg;position:relative;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .25s ease-out,box-shadow .3s;display:flex;flex-direction:column}
.tcard:hover{box-shadow:0 30px 60px -20px rgba(30,30,80,.45)}
.tcard .glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.25),transparent 55%);opacity:0;transition:opacity .3s;z-index:3}
.tcard:hover .glare{opacity:1}
.tmedia{position:relative;aspect-ratio:16/11;max-width:100%;background:var(--navy);color:#fff;overflow:hidden}
.tmedia img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.tcard:hover .tmedia img{transform:scale(1.05)}
.tph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 14px),linear-gradient(140deg,#2E2E6F,#1C1C4A)}
.tph .big{font-family:var(--numbers-f,var(--f-display));font-weight:var(--numbers-w,900);font-size:calc(clamp(2.6rem,5.5vw,4.2rem) * var(--numbers-k,1));line-height:.9;transform:translateZ(40px);font-variant-numeric:tabular-nums}
.tph .big small{font-size:.32em;color:var(--orange);margin-left:6px;font-weight:700}
.tph .cap{font-family:var(--label-f,var(--f-data));font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-top:6px}
.tph .stack{position:absolute;right:18px;top:18px;display:grid;grid-template-columns:repeat(3,22px);gap:4px}
.tph .stack i{height:12px;border-radius:2px;background:rgba(255,255,255,.14)}
.tph .stack i:nth-child(3n+1){background:var(--orange)}
.tbody{padding:22px 22px 24px;display:flex;flex-direction:column;gap:10px;flex:1;transform:translateZ(20px)}
.tbody h3{font-weight:var(--sub-w,900);font-size:calc(1.45rem * var(--sub-k,1))}
.tbody p{color:var(--muted);font-size:.95em}
.topen{margin-top:auto;padding-top:8px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px}
.topen svg{width:18px;height:18px;transition:transform .2s}
.tcard:hover .topen svg{transform:translateX(4px)}
.badge{display:inline-flex;align-self:flex-start;font-family:var(--label-f,var(--f-data));font-weight:var(--label-w,700);font-size:calc(.7rem * var(--label-k,1));letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--accent-ink)}
.tmedia .badge{position:absolute;left:16px;top:16px;background:rgba(255,144,18,.95);color:#1F140F;z-index:2}

/* specs */
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.spec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.spec b{font-family:var(--numbers-f,var(--f-display));font-size:calc(1.7rem * var(--numbers-k,1));font-weight:var(--numbers-w,900);line-height:1.05;font-variant-numeric:tabular-nums}
.spec b small{font-size:.5em;color:var(--accent-ink);margin-left:4px;font-weight:700}
.spec span{font-size:.86em;color:var(--muted)}
.specs.lift{margin-top:-40px;position:relative;z-index:2}
.specs.lift .spec{box-shadow:var(--shadow)}

/* page body */
.page{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;align-items:start}
.page.full{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.page{grid-template-columns:1fr;gap:36px}}
.prose{max-width:68ch;display:block}
.prose>*{margin-top:0;margin-bottom:0}.prose>*+*{margin-top:16px}
.prose::after{content:"";display:block;clear:both}
.prose figure.rimg{margin-left:0;margin-right:0}
.prose figure.rimg img{display:block;width:100%;height:auto;border-radius:10px;background:var(--surface-2)}
.prose figcaption{font-size:.85em;color:var(--muted);margin-top:6px}
.rw-25{width:25%}.rw-33{width:33.333%}.rw-50{width:50%}.rw-75{width:75%}.rw-100{width:100%}
.ra-center{margin-left:auto!important;margin-right:auto!important}
.ra-left{float:left;margin:4px 22px 12px 0!important}.ra-right{float:right;margin:4px 0 12px 22px!important}
.rw-100.ra-left,.rw-100.ra-right{float:none;margin:16px 0 0!important}
@media (max-width:600px){.prose figure.rimg{float:none;width:100%;margin:16px 0 0!important}}
.prose h3{font-size:calc(clamp(1.4rem,2.4vw,1.8rem) * var(--sub-k,1));font-weight:var(--sub-w,900);margin-top:16px}
.prose h3:first-child{margin-top:0}
.prose ul{margin:0;padding-left:20px;display:grid;gap:6px}
.prose a{color:var(--accent);text-underline-offset:3px}
.aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(var(--bar-h) + 24px)}
.aside .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.aside h4{font-family:var(--label-f,var(--f-data));font-weight:var(--label-w,700);font-size:calc(.75rem * var(--label-k,1));letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.aside nav{display:flex;flex-direction:column}
.aside nav a{text-decoration:none;padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.aside nav a:last-child{border-bottom:0}
.aside nav a[aria-current="page"]{color:var(--accent-ink);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:8px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;transition:transform .25s,box-shadow .25s}
.vcard:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.vcard i{width:34px;height:34px;border-radius:10px;background:var(--navy);display:grid;place-items:center;color:var(--orange);font-style:normal;font-family:var(--f-display);font-weight:900}
.vcard h4{font-size:calc(1.15rem * var(--sub-k,1));font-weight:var(--sub-w,900)}
.vcard p{color:var(--muted);font-size:.93em}
.docs{display:flex;flex-direction:column;gap:10px}
.doc{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;transition:border-color .2s,transform .2s}
.doc:hover{border-color:var(--orange);transform:translateX(3px)}
.doc .ic{width:40px;height:48px;flex:0 0 auto;border-radius:6px;background:var(--navy);color:#fff;display:grid;place-items:end center;padding-bottom:6px;font:700 .62rem var(--f-data);letter-spacing:.08em;position:relative;overflow:hidden}
.doc .ic::before{content:"";position:absolute;right:0;top:0;border:8px solid transparent;border-right-color:var(--bg);border-top-color:var(--bg)}
.doc b{display:block;line-height:1.3}
.doc small{color:var(--muted)}
.doc .go{margin-left:auto;color:var(--accent);font-weight:700;font-size:.88rem;white-space:nowrap}

/* news / projects */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.ncard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;transition:transform .3s,box-shadow .3s}
.ncard:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
.ncard .im{aspect-ratio:16/10;max-width:100%;background:linear-gradient(140deg,#2E2E6F,#1C1C4A);position:relative;overflow:hidden}
.ncard .im img{width:100%;height:100%;object-fit:cover;display:block}
.ncard .im .mk{position:absolute;left:18px;bottom:14px;color:rgba(255,255,255,.5);font:900 2.4rem var(--f-display)}
.ncard .tx{padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.ncard time,.meta{font-family:var(--label-f,var(--f-data));font-size:calc(.78rem * var(--label-k,1));letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.ncard h3{font-size:calc(1.25rem * var(--sub-k,1));font-weight:var(--sub-w,900)}
.ncard p{color:var(--muted);font-size:.93em}
.article{max-width:760px}
.article .cover{border-radius:var(--r);overflow:hidden;margin-bottom:28px;aspect-ratio:16/9;max-width:100%}
.article .cover img{width:100%;height:100%;object-fit:cover;display:block}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;color:var(--accent);margin-bottom:24px}
.back svg{width:16px;height:16px;transform:rotate(180deg)}

/* publications / magazine */
.pubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.pub{display:flex;flex-direction:column;gap:12px;text-decoration:none}
.pub .cv{aspect-ratio:3/4;max-width:100%;border-radius:10px;overflow:hidden;background:linear-gradient(160deg,#2E2E6F 0%,#1C1C4A 70%);color:#fff;position:relative;box-shadow:var(--shadow);transition:transform .35s}
.pub:hover .cv{transform:perspective(800px) rotateY(-8deg) translateY(-4px)}
.pub .cv img{width:100%;height:100%;object-fit:cover;display:block}
.pub .cv .ph{position:absolute;inset:0;padding:20px;display:flex;flex-direction:column;justify-content:space-between}
.pub .cv .ph b{font:900 1.35rem/1.1 var(--f-display)}
.pub .cv .ph span{font:900 2.6rem var(--f-display);color:var(--orange)}
.pub .cv .ph i{position:absolute;right:0;top:0;width:40%;height:8px;background:var(--orange)}
.pub h3{font-size:calc(1.1rem * var(--sub-k,1));font-weight:var(--sub-w,900)}
.pub small{color:var(--muted)}
.feature{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:40px;align-items:center;margin-bottom:56px}
@media (max-width:720px){.feature{grid-template-columns:1fr}}
.feature .pub{max-width:300px}
.feature h2{font-family:var(--section-f,var(--f-display));font-size:calc(clamp(1.8rem,3.5vw,2.6rem) * var(--section-k,1));font-weight:var(--section-w,900);margin:10px 0 14px}

/* gallery */
.gal{columns:3 260px;column-gap:14px}
.gal button{display:block;width:100%;margin:0 0 14px;padding:0;border:0;border-radius:12px;overflow:hidden;background:var(--surface-2);break-inside:avoid;position:relative}
.gal img{width:100%;display:block;transition:transform .5s}
.gal button:hover img{transform:scale(1.04)}
.gal figcaption{position:absolute;inset:auto 0 0;padding:24px 14px 10px;color:#fff;font-size:.85rem;text-align:left;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent)}
.lb{position:fixed;inset:0;z-index:90;background:rgba(8,8,24,.92);display:grid;grid-template-rows:1fr auto;padding:max(16px,env(safe-area-inset-top,0px)) var(--gut-r) max(16px,env(safe-area-inset-bottom,0px)) var(--gut);color:#fff}
.lb img{max-width:100%;max-height:100%;margin:auto;object-fit:contain;align-self:center;justify-self:center;min-height:0}
.lb .cap{text-align:center;padding-top:12px;font-size:.95rem}
.lb .x,.lb .pv,.lb .nx{position:absolute;border:0;background:rgba(255,255,255,.12);color:#fff;width:48px;height:48px;border-radius:50%;font-size:22px}
.lb .x{top:max(16px,env(safe-area-inset-top,0px));right:var(--gut-r)}
.lb .pv{left:var(--gut);top:50%}.lb .nx{right:var(--gut-r);top:50%}

/* ícones e números: mesmo desenho */
.ico{width:44px;height:44px;flex:0 0 auto;border-radius:12px;background:var(--navy);color:var(--orange);display:grid;place-items:center;font:900 1.15rem/1 var(--numbers-f,var(--f-display));font-variant-numeric:tabular-nums}
.ico svg{width:22px;height:22px}
.spec .ico,.stat .ico,.vcard .ico,.ico{color:var(--orange)}
.ico.on-dark{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.stat .ico{margin-bottom:8px}
.spec .ico{width:38px;height:38px;border-radius:10px;margin-bottom:6px}.spec .ico svg{width:20px;height:20px}
.vcard .ico{margin-bottom:2px}
.cline dt{display:flex;align-items:center;gap:6px}.cline dt svg{flex:0 0 auto}
/* redes sociais */
.soc{display:flex;gap:6px;align-items:center}
.soc .si{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;opacity:.85;transition:opacity .2s,background .2s,color .2s;text-decoration:none}
.soc .si:hover{opacity:1;background:var(--orange);color:#1F140F}
.soc.big{gap:10px;flex-wrap:wrap}.soc.big .si{width:38px;height:38px;background:rgba(255,255,255,.1);opacity:1}
.nav .m-row .soc .si,.nav .m-row .si{color:var(--ink)}
/* títulos: imagem e cor */
.t-img-wrap{margin:10px 0 6px}.t-img{display:block;max-width:100%;height:auto}
.t-left{display:flex;align-items:center;gap:.4em}.t-left .t-img{flex:0 0 auto}
/* texto rico */
.prose h2{font-size:calc(clamp(1.6rem,2.8vw,2.1rem) * var(--sub-k,1));font-weight:var(--sub-w,900);margin-top:18px}
.prose h4{font-size:calc(1.15rem * var(--sub-k,1));font-weight:var(--sub-w,900)}
.prose ol{margin:0;padding-left:22px;display:grid;gap:6px}
.prose blockquote{margin:6px 0;padding:6px 0 6px 18px;border-left:3px solid var(--orange);font-size:1.08em;color:var(--muted)}
.prose hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.tc-blue{color:#2E2E6F}.tc-orange{color:#FF9012}.tc-lightgrey{color:#D9D9E1}.tc-white{color:#fff}.tc-black{color:#1F140F}
.loc .body.prose{margin-top:22px}
/* pdf viewer */
.pdf-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pdf-tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:700}
.pdf-tabs button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.pdfv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.pdf-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pdf-bar h3{font-size:calc(1.2rem * var(--sub-k,1));font-weight:var(--sub-w,900)}
.pdf-bar .meta2{color:var(--muted);font-size:.86em}
.pdf-bar .tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pdf-bar .ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:38px;height:38px;padding:0 10px;font-weight:700}
.pdf-bar .btn{padding:9px 16px;font-size:.9rem}
.pdf-pages{background:var(--surface-2);max-height:min(82vh,1100px);overflow:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.pdf-pages canvas{display:block;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);max-width:none}
.pdf-pages .ph{background:#fff;opacity:.6}
.pdf-pages iframe{width:100%;height:78vh;border:0;background:#fff}
.pdf-msg{padding:40px 16px;color:var(--muted);text-align:center}
/* berth */
.berth{min-width:820px}
.berth td,.berth th{text-align:left}
.st{display:inline-flex;align-items:center;gap:6px;font-family:var(--label-f,var(--f-data));font-weight:700;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--surface-2)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--steel)}
.st.berthed{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--accent-ink)}.st.berthed::before{background:var(--orange)}
.st.expected{color:var(--accent)}.st.expected::before{background:var(--accent)}
.updated{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:14px;color:var(--muted);font-size:.88rem}

/* contacts / forms */
.contact{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px;align-items:start}
@media (max-width:900px){.contact{grid-template-columns:1fr}}
.cinfo{background:var(--navy-deep);color:#fff;border-radius:18px;padding:clamp(24px,4vw,40px);display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
.cinfo::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:30px solid rgba(255,144,18,.12)}
.cline{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:baseline}
.cline dt{font-family:var(--label-f,var(--f-data));font-size:calc(.74rem * var(--label-k,1));letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.cline dd{margin:0;font-size:1.05em;white-space:pre-line;word-break:break-word;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.copy{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:999px;font-size:.72rem;padding:3px 10px;font-weight:700}
.copy:hover{background:rgba(255,255,255,.2)}
.cinfo .soc a{color:#fff;opacity:.8;text-decoration:none}.cinfo .soc a:hover{opacity:1;color:var(--orange)}

<body>
<header class="hdr" id="hdr">
  <div class="util"><div class="wrap util-in"><nav id="topnav" aria-label="Quick links"></nav><div class="util-r"><div class="soc" id="socTop"></div><div class="lang" id="langTop" role="group" aria-label="Language"></div></div></div></div>

<main>

    <video id="heroVideo" class="hv" muted playsinline autoplay preload="auto" aria-hidden="true" tabindex="-1" hidden></video>

<script src="config.js"></script>
<script>/* Camada de dados partilhada entre o site e o CMS — versão 2 (Supabase).
   1) Se config.js tiver o URL e a chave publicável do Supabase → modo "supabase":
      conteúdo na tabela site_content, mensagens na tabela inbox, ficheiros no bucket "media",
      login do CMS com Supabase Auth (email + palavra-passe).
   2) Dentro do Claude → base de dados do artefacto.
   3) Sem configuração → IndexedDB do navegador (modo local, como a versão 1). */
const Store=(function(){
  const KEY="cdm-port-of-beira-content-v3",IKEY="cdm-port-of-beira-inbox-v1",DBN="cdm-port-of-beira",SKEY="cdm-sb-session",CKEY="cdm-sb-cache";
  let mode="local",db=null,assets=null,user=null,downloads=null,idb=null,bc=null;
  /* ---------- Supabase (REST, sem bibliotecas externas) ---------- */
  const CFG=(()=>{const c=window.CDM_SUPABASE||{};const url=String(c.url||"").trim().replace(/\/+$/,""),key=String(c.key||c.anonKey||"").trim();
    return url&&key&&/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)[:/])/.test(url+"/")&&!/COLE|PASTE|xxxx/i.test(url+key)?{url,key,bucket:c.bucket||"media"}:null})();
  let sess=null,inboxCb=null,contentCb=null,lastStamp=null,timers=[];
  const lsGet=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}};
  const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  function SBErr(msg,status,code){const e=new Error(msg);e.status=status;e.code=code;return e}
  async function sb(path,opt={},auth=true){
    if(auth)await fresh();
    const h=Object.assign({apikey:CFG.key},opt.headers||{});
    if(auth&&sess)h.Authorization="Bearer "+sess.access_token;else if(!/^sb_/.test(CFG.key))h.Authorization="Bearer "+CFG.key;
    if(opt.json!==undefined){h["Content-Type"]="application/json";opt.body=JSON.stringify(opt.json)}
    const r=await fetch(CFG.url+path,{method:opt.method||"GET",headers:h,body:opt.body,cache:"no-store"});
    const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
    if(!r.ok)throw SBErr((j&&(j.msg||j.message||j.error_description||j.error))||("HTTP "+r.status),r.status,j&&(j.error_code||j.code));
    return j;
  }
  function keep(s){if(!s||!s.access_token){sess=null;lsSet(SKEY,null);return null}
    sess={access_token:s.access_token,refresh_token:s.refresh_token,expires_at:s.expires_at||Math.floor(Date.now()/1000)+(+s.expires_in||3600),user:s.user||(sess&&sess.user)||null};lsSet(SKEY,sess);return sess}
  let refreshing=null;
  async function fresh(){
    if(!sess||!sess.refresh_token)return;
    if(sess.expires_at-60>Date.now()/1000)return;
    if(!refreshing)refreshing=(async()=>{try{const s=await sb("/auth/v1/token?grant_type=refresh_token",{method:"POST",json:{refresh_token:sess.refresh_token}},false);keep(s)}catch(e){if(e.status>=400&&e.status<500)keep(null)}finally{refreshing=null}})();
    await refreshing;
  }
  const auth={
    get configured(){return!!CFG},
    get session(){return sess},
    get email(){return sess&&sess.user&&sess.user.email||""},
    async signIn(email,password){const s=await sb("/auth/v1/token?grant_type=password",{method:"POST",json:{email,password}},false);keep(s);return s.user},
    async signUp(email,password){const s=await sb("/auth/v1/signup",{method:"POST",json:{email,password}},false);if(s&&s.access_token)keep(s);return s},
    async recover(email,redirectTo){await sb("/auth/v1/recover",{method:"POST",json:{email,redirect_to:redirectTo||location.href.split("#")[0]}},false)},
    async setPassword(password){const u=await sb("/auth/v1/user",{method:"PUT",json:{password}});if(sess)sess.user=u;lsSet(SKEY,sess);return u},
    async signOut(){try{await sb("/auth/v1/logout",{method:"POST"})}catch(e){}keep(null)},
    async isEditor(){if(!sess)return false;try{return(await sb("/rest/v1/rpc/is_editor",{method:"POST",json:{}}))===true}catch(e){return false}},
    /* link de email (recuperação/convite/confirmação) devolve #access_token=… no URL */
    async fromLink(){const h=location.hash.replace(/^#/,"");if(!/access_token=/.test(h))return null;const p=new URLSearchParams(h);
      keep({access_token:p.get("access_token"),refresh_token:p.get("refresh_token"),expires_in:p.get("expires_in")});
      try{sess.user=await sb("/auth/v1/user");lsSet(SKEY,sess)}catch(e){}
      try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
      return p.get("type")||"link"},
    async editors(){return await sb("/rest/v1/editors?select=email,created_at&order=created_at.asc")||[]},
    async addEditor(email){await sb("/rest/v1/editors",{method:"POST",json:{email:String(email).trim().toLowerCase()},headers:{Prefer:"return=minimal"}})},
    async removeEditor(email){await sb("/rest/v1/editors?email=eq."+encodeURIComponent(email),{method:"DELETE"})},
    async history(){return await sb("/rest/v1/site_content_history?select=id,saved_at,saved_by&order=saved_at.desc&limit=30")||[]},
    async version(id){const r=await sb("/rest/v1/site_content_history?select=body&id=eq."+encodeURIComponent(id));return r&&r[0]?r[0].body:null}
  };
  async function sbContent(){const r=await sb("/rest/v1/site_content?id=eq.main&select=body,updated_at",{},!!sess);const row=r&&r[0];
    if(!row)return{body:null,stamp:null};const body=row.body||{};if(!body.updatedAt)body.updatedAt=row.updated_at;return{body,stamp:row.updated_at}}
  async function sbInbox(){const r=await sb("/rest/v1/inbox?select=*&order=created_at.desc&limit=500")||[];
    return r.map(x=>Object.assign({},x.data||{},{id:x.id,createdAt:x.created_at,read:!!x.read,type:(x.data&&x.data.type)||x.kind}))}
  function every(ms,fn){const t=setInterval(()=>{if(document.visibilityState!=="hidden")fn()},ms);timers.push(t);return()=>clearInterval(t)}
  function safeName(n){return String(n||"ficheiro").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9.]+/g,"-").replace(/^-+|-+$/g,"").slice(-60)||"ficheiro"}
  const EXT={"image/webp":"webp","image/jpeg":"jpg","image/png":"png","image/gif":"gif","image/avif":"avif","video/mp4":"mp4","video/webm":"webm","application/pdf":"pdf","font/woff2":"woff2","font/woff":"woff","font/ttf":"ttf","font/otf":"otf"};
  function folder(t){return/^image\//.test(t)?"imagens":/^video\//.test(t)?"videos":t==="application/pdf"?"documentos":/^font\//.test(t)?"fontes":"outros"}
  async function dataToBlob(u){const r=await fetch(u);return await r.blob()}

  /* ---------- Claude / local ---------- */
  async function use(name){try{return await window.claude.use(name)}catch(e){return null}}
  function openIDB(){return new Promise(res=>{try{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})}
  const tx=(m,f)=>new Promise((res,rej)=>{const t=idb.transaction("kv",m),s=t.objectStore("kv"),r=f(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new DOMException("abort","QuotaExceededError"))});
  const readLS=k=>lsGet(k);
  async function readL(k){if(idb){try{let v=await tx("readonly",s=>s.get(k));if(v==null){v=readLS(k);if(v!=null){await tx("readwrite",s=>s.put(v,k));try{localStorage.removeItem(k)}catch(e){}}}return v??null}catch(e){}}return readLS(k)}
  async function writeL(k,v){if(idb){await tx("readwrite",s=>s.put(v,k));try{localStorage.removeItem(k)}catch(e){}}else localStorage.setItem(k,JSON.stringify(v));try{bc&&bc.postMessage(k)}catch(e){}}
  async function init(){
    if(CFG){mode="supabase";sess=lsGet(SKEY);if(sess&&!sess.refresh_token)sess=null;return mode}
    if(window.claude&&typeof window.claude.use==="function"){
      db=await use("db");
      if(db){mode="cloud";[assets,user,downloads]=await Promise.all([use("assets"),use("user"),use("downloads")]);return mode}
    }
    if(window.indexedDB)idb=await openIDB();
    try{bc=new BroadcastChannel(DBN)}catch(e){}
    return mode;
  }
  function watch(k,fn){const onBC=e=>{if(e.data===k)fn()},onLS=e=>{if(e.key===k)fn()};if(bc)bc.addEventListener("message",onBC);window.addEventListener("storage",onLS);return()=>{if(bc)bc.removeEventListener("message",onBC);window.removeEventListener("storage",onLS)}}
  /* opts.poll: verificar alterações periodicamente (CMS); opts.cache: mostrar a última versão guardada no navegador enquanto carrega (site) */
  function subscribe(cb,opts={}){
    if(mode==="supabase"){contentCb=cb;let alive=true;
      if(opts.cache){const c=lsGet(CKEY);if(c&&c.body)cb(c.body,{cached:true})}
      const load=async(first)=>{try{const{body,stamp}=await sbContent();if(!alive)return;if(!first&&stamp===lastStamp)return;lastStamp=stamp;
          if(opts.cache)lsSet(CKEY,body?{body,stamp}:null);cb(body,{})}
        catch(e){console.warn("supabase",e);if(first&&!(opts.cache&&lsGet(CKEY)))cb(null,{error:e})}};
      load(true);const stop=opts.poll?every(opts.poll,()=>load(false)):()=>{};
      const vis=()=>{if(document.visibilityState==="visible")load(false)};document.addEventListener("visibilitychange",vis);
      return()=>{alive=false;stop();document.removeEventListener("visibilitychange",vis)}}
    if(mode==="cloud")return db.doc("site/content").onSnapshot(s=>cb(s.exists?JSON.parse(JSON.stringify(s.data())):null,s.metadata),e=>console.warn("db",e));
    const load=()=>readL(KEY).then(v=>cb(v,{}));load();return watch(KEY,load);
  }
  async function save(obj){
    const body=JSON.parse(JSON.stringify(obj));body.updatedAt=new Date().toISOString();
    if(mode==="supabase"){const r=await sb("/rest/v1/site_content?on_conflict=id",{method:"POST",json:[{id:"main",body}],headers:{Prefer:"resolution=merge-duplicates,return=representation"}});
      const row=r&&r[0];if(!row)throw SBErr("Sem permissão para publicar",403);lastStamp=row.updated_at;body.updatedAt=row.updated_at;return body}
    if(mode==="cloud"){await db.doc("site/content").set(body);return body}
    await writeL(KEY,body);return body;
  }
  async function upload(blob,dataUrl,type,name){
    if(mode==="supabase"){
      if(!blob&&dataUrl)blob=await dataToBlob(dataUrl);
      const t=type||(blob&&blob.type)||"application/octet-stream",ext=EXT[t]||((blob&&blob.name||"").split(".").pop()||"bin");
      let base=safeName(name||(blob&&blob.name)||"").replace(/\.[a-z0-9]+$/,"");if(!base||base==="ficheiro")base={imagens:"imagem",videos:"video",documentos:"documento",fontes:"fonte"}[folder(t)]||"ficheiro";
      const d=new Date(),path=`${folder(t)}/${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${base}-${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}.${ext}`;
      await fresh();
      const r=await fetch(`${CFG.url}/storage/v1/object/${CFG.bucket}/${path}`,{method:"POST",headers:{apikey:CFG.key,Authorization:"Bearer "+(sess?sess.access_token:CFG.key),"Content-Type":t,"cache-control":"31536000","x-upsert":"false"},body:blob});
      if(!r.ok){let m="HTTP "+r.status;try{const j=await r.json();m=j.message||j.error||m}catch(e){}throw SBErr(m,r.status)}
      return `${CFG.url}/storage/v1/object/public/${CFG.bucket}/${path.split("/").map(encodeURIComponent).join("/")}`}
    if(mode==="cloud"&&assets){const r=await assets.upload(blob,type?{type}:undefined);return "/_blob/"+r.id}
    return dataUrl;
  }
  /* mensagens de contacto e denúncias */
  async function submit(msg){
    const m=Object.assign({},msg,{createdAt:new Date().toISOString(),read:false});
    if(mode==="supabase"){const data=Object.assign({},msg);await sb("/rest/v1/inbox",{method:"POST",json:{kind:String(msg.type||"contact").slice(0,40),data},headers:{Prefer:"return=minimal"}},false);return}
    if(mode==="cloud"){await db.collection("inbox").add(m);return}
    const list=(await readL(IKEY))||[];m.id="m"+Date.now().toString(36);list.unshift(m);await writeL(IKEY,list);
  }
  function inbox(cb){
    if(mode==="supabase"){inboxCb=cb;const load=()=>sbInbox().then(cb).catch(e=>{console.warn("inbox",e);cb([])});load();return every(30000,load)}
    if(mode==="cloud")return db.collection("inbox").orderBy("createdAt","desc").limit(500).onSnapshot(s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data()))),e=>{console.warn("inbox",e);cb([])});
    const load=()=>readL(IKEY).then(v=>cb(v||[]));load();return watch(IKEY,load);
  }
  async function inboxUpdate(id,patch,cbLocal){
    if(mode==="supabase"){const q="/rest/v1/inbox?id=eq."+encodeURIComponent(id);
      if(patch===null)await sb(q,{method:"DELETE"});else await sb(q,{method:"PATCH",json:{read:!!patch.read},headers:{Prefer:"return=minimal"}});
      const l=await sbInbox();if(cbLocal)cbLocal(l);else if(inboxCb)inboxCb(l);return}
    if(mode==="cloud"){if(patch===null)await db.doc("inbox/"+id).delete();else await db.doc("inbox/"+id).update(patch);return}
    let list=(await readL(IKEY))||[];if(patch===null)list=list.filter(m=>m.id!==id);else list=list.map(m=>m.id===id?Object.assign({},m,patch):m);
    await writeL(IKEY,list);cbLocal&&cbLocal(list);
  }
  async function usage(){let used=0,quota=0;try{const e=await navigator.storage.estimate();used=e.usage||0;quota=e.quota||0}catch(e){}return{used,quota,engine:Store.engine}}
  return{init,subscribe,save,upload,submit,inbox,inboxUpdate,usage,auth,
    get mode(){return mode},get remote(){return mode!=="local"},get engine(){return mode==="supabase"?"supabase":mode==="cloud"?"cloud":idb?"idb":"ls"},
    get user(){return user},get downloads(){return downloads},get config(){return CFG?{url:CFG.url,bucket:CFG.bucket}:null}};
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

    else{HV.list.splice(HV.prep,1);HV.prep=-1;if(HV.i>=HV.list.length)HV.i=0;if(HV.list.length===1)vEls()[HV.cur].loop=true}});
});
function applyFonts(){const f=data.brand.fonts||{},w={light:300,regular:400,medium:500,bold:700,black:900};let css="";for(const k in w)if(f[k])css+=`@font-face{font-family:"Dax";src:url("${f[k]}");font-weight:${w[k]};font-display:swap}\n`;$("#font-uploads").textContent=css}

/* ---------- routing ---------- */
function readRoute(){let h=decodeURIComponent((location.hash||"").slice(1));if(h==="cms"||h==="admin"){location.href="admin.html";return null}return h||"home"}
function go(){const r=readRoute();if(r==null)return;const changed=r!==route;route=r;closeMenu();render();if(changed)window.scrollTo({top:0,behavior:"instant"})}
window.addEventListener("hashchange",go);

/* ---------- interactions ---------- */
function closeMenu(){$("#hdr").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");document.querySelectorAll(".nav li.open").forEach(li=>{li.classList.remove("open");li.querySelector("button").setAttribute("aria-expanded","false")})}
$("#menuBtn").addEventListener("click",()=>{const o=$("#hdr").classList.toggle("open");$("#menuBtn").setAttribute("aria-expanded",o)});
document.addEventListener("click",async e=>{
  const t=e.target;
  const sb=t.closest("[data-sub]");if(sb){const li=sb.parentElement,o=!li.classList.contains("open");document.querySelectorAll(".nav li.open").forEach(x=>{if(x!==li){x.classList.remove("open");x.querySelector("button").setAttribute("aria-expanded","false")}});li.classList.toggle("open",o);sb.setAttribute("aria-expanded",o);return}
  if(!t.closest(".nav"))document.querySelectorAll(".nav li.open").forEach(x=>{x.classList.remove("open");x.querySelector("button").setAttribute("aria-expanded","false")});
  const lg=t.closest("[data-lang]");if(lg){lang=lg.dataset.lang;try{localStorage.setItem("cdm-lang",lang)}catch(_){}render();return}
  const pt=t.closest("[data-pdftab]");if(pt){const [sl,i]=pt.dataset.pdftab.split("|");pdfSel[sl]=+i;document.querySelectorAll(`[data-pdftab^="${sl}|"]`).forEach(b=>b.setAttribute("aria-selected",b===pt));document.querySelectorAll(`[data-pdfdoc^="${sl}|"]`).forEach(v=>v.hidden=v.dataset.pdfdoc!==pt.dataset.pdftab);showPDFs();return}
  const pz=t.closest("[data-pdfz]");if(pz){const el=pz.closest(".pdfv"),k=el.dataset.pdfdoc,dz=+pz.dataset.pdfz;pdfZoom[k]=dz===0?1:Math.max(.5,Math.min(3,(pdfZoom[k]||1)*(dz>0?1.25:.8)));renderPDF(el);return}
  const sc=t.closest("[data-scroll]");if(sc){const el=document.getElementById(sc.dataset.scroll);if(el)el.scrollIntoView({behavior:"smooth"});return}
  const db=t.closest("[data-dest]");if(db){selDest=+db.dataset.dest;updateDist();return}
  const cp=t.closest("[data-copy]");if(cp){try{await navigator.clipboard.writeText(cp.dataset.copy);toast(U("copied"))}catch(_){const r=document.createRange();r.selectNodeContents(cp.parentElement);getSelection().removeAllRanges();getSelection().addRange(r)}return}
  const g=t.closest("[data-gal]");if(g){galleryIdx=+g.dataset.gal;openLB();return}
  if(t.closest("[data-lbx]")||t.classList.contains("lb")){closeLB();return}
  if(t.closest("[data-lbp]")){galleryIdx=(galleryIdx-1+data.gallery.length)%data.gallery.length;openLB();return}
  if(t.closest("[data-lbn]")){galleryIdx=(galleryIdx+1)%data.gallery.length;openLB();return}
  if(t.closest(".nav a"))closeMenu();
});
document.addEventListener("change",e=>{if(e.target.id==="wf_anon")$("#wf_cbox").hidden=e.target.checked});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeLB();closeMenu()}
  if($("#overlay").innerHTML&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){galleryIdx=(galleryIdx+(e.key==="ArrowLeft"?-1:1)+data.gallery.length)%data.gallery.length;openLB()}
  const c=e.target.closest&&e.target.closest(".map .city");if(c&&(e.key==="Enter"||e.key===" ")){e.preventDefault();selDest=+c.dataset.dest;updateDist()}
});
let lbFocus=null;
function openLB(){const x=data.gallery[galleryIdx];if(!x)return;if(!$("#overlay").innerHTML)lbFocus=document.activeElement;
  $("#overlay").innerHTML=`<div class="lb" role="dialog" aria-modal="true" aria-label="${esc(L(x.caption)||"Photo")}"><img src="${esc(x.image)}" alt="${esc(L(x.caption))}"><p class="cap">${esc(L(x.caption))} <span style="opacity:.5">${galleryIdx+1}/${data.gallery.length}</span></p><button class="x" data-lbx aria-label="Close">×</button>${data.gallery.length>1?'<button class="pv" data-lbp aria-label="Previous">‹</button><button class="nx" data-lbn aria-label="Next">›</button>':""}</div>`;$("#overlay .x").focus()}
function closeLB(){if($("#overlay").innerHTML){$("#overlay").innerHTML="";lbFocus&&lbFocus.focus&&lbFocus.focus()}}
document.addEventListener("submit",async e=>{
  const f=e.target;if(f.id!=="contactForm"&&f.id!=="whistleForm")return;e.preventDefault();
  const out=f.id==="contactForm"?$("#cf_out"):$("#wf_out"),btn=f.querySelector('[type="submit"]');
  const req=[...f.querySelectorAll("[required]")].filter(i=>!i.value.trim()||(i.type==="email"&&!/^\S+@\S+\.\S+$/.test(i.value)));
  if(req.length){out.innerHTML=`<div class="fmsg err">${U("required")}</div>`;req[0].focus();return}
  const fd=Object.fromEntries(new FormData(f).entries());
  const msg=f.id==="contactForm"?{type:"contact",name:fd.name,company:fd.company||"",email:fd.email,phone:fd.phone||"",subject:fd.subject||"",message:fd.message,lang}
    :{type:"whistleblowing",anonymous:!!fd.anon,category:fd.category,message:fd.message,contact:fd.anon?"":(fd.contact||""),lang};
  btn.disabled=true;const old=btn.innerHTML;btn.textContent=U("sending");
  try{await Store.submit(msg);f.reset();if($("#wf_cbox"))$("#wf_cbox").hidden=true;out.innerHTML=`<div class="fmsg ok">${U(f.id==="contactForm"?"sent":"wsent")}</div>`}
  catch(err){out.innerHTML=`<div class="fmsg err">${U("failed")}${esc(data.contacts.email)}.</div>`}
  btn.disabled=false;btn.innerHTML=old;
});
const fine=matchMedia("(hover:hover) and (pointer:fine)").matches,reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function bindTilt(){if(!fine||reduce)return;document.querySelectorAll(".tcard").forEach(c=>{
  c.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty("--ry",((x-.5)*14).toFixed(2)+"deg");c.style.setProperty("--rx",((.5-y)*12).toFixed(2)+"deg");c.style.setProperty("--gx",(x*100)+"%");c.style.setProperty("--gy",(y*100)+"%")});
  c.addEventListener("pointerleave",()=>{c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")})})}
const smallMQ=matchMedia("(max-width:820px)");
try{smallMQ.addEventListener("change",()=>{if((route.split("~")[0]||"home")==="home")render()})}catch(e){}
const onScroll=()=>$("#hdr").classList.toggle("solid",window.scrollY>40);window.addEventListener("scroll",onScroll,{passive:true});

/* ---------- 3D container yard ---------- */
function initHero3D(){
  const host=$("#hero3d");if(!window.THREE||!host)return;
  let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(e){return}
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);
  const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x1C1C4A,40,95);
  const cam=new THREE.PerspectiveCamera(32,1,.1,200);
  scene.add(new THREE.HemisphereLight(0xdfe0ff,0x1C1C4A,.85));
  const sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(-12,24,14);scene.add(sun);
  const rim=new THREE.DirectionalLight(0xFF9012,.45);rim.position.set(20,6,-10);scene.add(rim);
  const world=new THREE.Group();scene.add(world);
  const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.6,metalness:.15});
  const mats=[M(0x2E2E6F),M(0xFF9012),M(0xA1A1AC),M(0x3D3D8F),M(0xE6E6EE),M(0x2E2E6F)];
  const edgeMat=new THREE.LineBasicMaterial({color:0x14142e,transparent:true,opacity:.55});
  const box=new THREE.BoxGeometry(4,1.05,1),edges=new THREE.EdgesGeometry(box);
  const ground=new THREE.Mesh(new THREE.BoxGeometry(46,.4,22),M(0x26265c));ground.position.set(0,-.2,-3);world.add(ground);
  const water=new THREE.Mesh(new THREE.PlaneGeometry(140,80),new THREE.MeshStandardMaterial({color:0x15153a,roughness:.25,metalness:.6}));water.rotation.x=-Math.PI/2;water.position.set(0,-.9,30);world.add(water);
  const edgeQ=new THREE.Mesh(new THREE.BoxGeometry(46,.5,.4),M(0xFF9012));edgeQ.position.set(0,-.15,8.1);world.add(edgeQ);
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const addC=(x,y,z,parent)=>{const c=new THREE.Mesh(box,mats[Math.floor(rnd()*mats.length)]);c.position.set(x,y,z);c.add(new THREE.LineSegments(edges,edgeMat));(parent||world).add(c);return c};
  for(let bx=-4;bx<=4;bx++){if(bx===0)continue;for(let row=0;row<6;row++){const h=1+Math.floor(rnd()*4);for(let k=0;k<h;k++)addC(bx*4.6,.53+k*1.06,-12+row*1.15)}}
  for(let bx=-3;bx<=3;bx++)for(let row=0;row<3;row++){const h=Math.floor(rnd()*3);for(let k=0;k<h;k++)addC(bx*4.6,.53+k*1.06,-3.5+row*1.15)}
  const ship=new THREE.Group();ship.position.set(2,0,13.5);world.add(ship);
  const hull=new THREE.Mesh(new THREE.BoxGeometry(34,2.4,6.4),M(0x1F140F));hull.position.y=-.2;ship.add(hull);
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(34.05,.35,6.45),M(0xB23A2A));stripe.position.y=-1.1;ship.add(stripe);
  const bridge=new THREE.Mesh(new THREE.BoxGeometry(3,4,5),M(0xE6E6EE));bridge.position.set(14,3,0);ship.add(bridge);
  for(let bx=-3;bx<=2;bx++)for(let r=0;r<5;r++){const h=1+Math.floor(rnd()*3);for(let k=0;k<h;k++)addC(bx*4.3,1.53+k*1.06,-2.3+r*1.15,ship)}
  const cranes=[];
  [-9,6].forEach((cx,ci)=>{const g=new THREE.Group();g.position.set(cx,0,6);world.add(g);const om=M(0xFF9012),dm=M(0x2E2E6F);
    [[-1.6,-2],[1.6,-2],[-1.6,2],[1.6,2]].forEach(([x,z])=>{const leg=new THREE.Mesh(new THREE.BoxGeometry(.35,12,.35),om);leg.position.set(x,6,z);g.add(leg)});
    const bA=new THREE.Mesh(new THREE.BoxGeometry(3.6,.5,.5),om);bA.position.set(0,12,-2);g.add(bA);const bB=bA.clone();bB.position.z=2;g.add(bB);
    const boom=new THREE.Mesh(new THREE.BoxGeometry(1.4,.7,26),om);boom.position.set(0,12.5,5);g.add(boom);
    const cab=new THREE.Mesh(new THREE.BoxGeometry(1.4,1,1.4),dm);cab.position.set(0,11.5,2);g.add(cab);
    const trolley=new THREE.Group();trolley.position.set(0,11.8,4);g.add(trolley);
    const cable=new THREE.Mesh(new THREE.BoxGeometry(.06,1,.06),new THREE.MeshBasicMaterial({color:0x101028}));trolley.add(cable);
    const load=new THREE.Mesh(box,mats[ci?3:1]);load.rotation.y=Math.PI/2;load.add(new THREE.LineSegments(edges,edgeMat));trolley.add(load);
    cranes.push({trolley,cable,load,phase:ci*2.2})});
  world.rotation.y=-.55;
  const target={x:0,y:0},cur={x:0,y:0};
  $("#hero").addEventListener("pointermove",e=>{const r=e.currentTarget.getBoundingClientRect();target.x=(e.clientX-r.left)/r.width-.5;target.y=(e.clientY-r.top)/r.height-.5});
  $("#hero").addEventListener("pointerleave",()=>{target.x=0;target.y=0});
  function resize(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
  new ResizeObserver(resize).observe(host);resize();
  let visible=false,running=false;const t0=performance.now();
  function frame(t){const s=(t-t0)/1000;cur.x+=(target.x-cur.x)*.05;cur.y+=(target.y-cur.y)*.05;const n=host.clientWidth<820;
    world.position.x=n?0:-6;world.rotation.y=-.55+cur.x*.5+(reduce?0:Math.sin(s*.12)*.08);
    cam.position.set(n?30:34,20+cur.y*-8,n?46:40);cam.lookAt(n?0:-4,1,0);
    cranes.forEach(c=>{const p=(Math.sin(s*.45+c.phase)+1)/2,lift=(Math.sin(s*.9+c.phase)+1)/2;c.trolley.position.z=-2+p*16;const drop=1.5+lift*6;c.load.position.y=-drop;c.cable.scale.y=drop;c.cable.position.y=-drop/2});
    renderer.render(scene,cam)}
  function loop(){if(!visible||reduce){running=false;return}running=true;frame(performance.now());requestAnimationFrame(loop)}
  new IntersectionObserver(es=>{visible=es[0].isIntersecting&&!host.hidden;if(visible){resize();if(reduce)frame(t0+4000);else if(!running)loop()}}).observe(host);
}

/* ---------- boot ---------- */
route=readRoute()||"home";
render();onScroll();initHero3D();
Store.init().then(()=>Store.subscribe(body=>{if(!body)return;data=merge(DEFAULTS,body);render()},{cache:true}));
})();
</script>
